<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVIO_exp · 3D viewer</title>
<!-- The 3D companion of the experiment reports (ROADMAP M2.2). Data: ../assets/experiments/<EXP>/viewer/, written by
     `lvx viewer <EXP>` (lvx/viewer.py). Deep link: ?exp=EXP-000&mission=arc-6. No build step, no server. -->
<style>
  :root { --bg: #0d1117; --panel: rgba(22, 27, 34, 0.92); --fg: #e6edf3; --muted: #8b949e; --line: #30363d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 270px; max-height: calc(100% - 24px); overflow: auto;
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  label { display: block; margin: 6px 0; cursor: pointer; }
  select, input[type=range] { width: 100%; }
  .swatch { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin: 0 6px 3px 0;
            vertical-align: middle; }
  .section { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  a { color: #58a6ff; }
  #status { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 600px) { #panel { width: auto; right: 12px; max-height: 45%; } }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1 id="title">3D viewer</h1>
  <div class="sub" id="subtitle">map and trajectories, GT frame</div>
  <label>Mission <select id="mission"></select></label>
  <div class="section" id="tracks"></div>
  <div class="section">
    <label>Map height cut (hide the ceiling) <input id="zcut" type="range" min="0" max="1000" value="1000"></label>
    <label>Point size <input id="size" type="range" min="1" max="60" value="12"></label>
    <label><input id="showmap" type="checkbox" checked> show map</label>
  </div>
  <div id="status">loading…</div>
  <div class="section sub">Drag to orbit, scroll to zoom, right-drag to pan.
    <a id="report" href="../experiments/">Experiment report</a></div>
  <div class="section sub">Data: <a href="https://huggingface.co/datasets/leggedrobotics/grand_tour_dataset">GrandTour</a>
    (MIT), Frey, Tuna et al., <a href="https://arxiv.org/abs/2602.18164">arXiv:2602.18164</a>. Maps are rebuilt
    from this project's estimates.</div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Line2 } from "three/addons/lines/Line2.js";
import { LineGeometry } from "three/addons/lines/LineGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";

const params = new URLSearchParams(location.search);
const exp = params.get("exp") || "EXP-000";
const base = `../assets/experiments/${exp}/viewer/`;
const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
$("view").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
camera.up.set(0, 0, 1);                                   // z up, as in the GT (total-station) frame
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let mapPoints = null, trackLines = {}, zRange = [0, 1], zLimits = [0, 1];

// Turbo-like height colours: the same idea as the matplotlib "turbo" map used for the PNG.
function turbo(x) {
  x = Math.min(1, Math.max(0, x));
  const r = 0.1357 + x * (4.5974 - x * (42.3277 - x * (130.5887 - x * (150.5666 - x * 58.1375))));
  const g = 0.0914 + x * (2.1856 + x * (4.8052 - x * (14.0195 - x * (4.2109 + x * 2.7747))));
  const b = 0.1067 + x * (12.5925 - x * (60.1097 - x * (109.0745 - x * (88.5066 - x * 26.8183))));
  return [r, g, b].map((c) => Math.min(1, Math.max(0, c)));
}

function clear() {
  for (const o of [mapPoints, ...Object.values(trackLines).flat()]) if (o) { scene.remove(o); o.geometry.dispose(); }
  mapPoints = null; trackLines = {};
}

async function load(mission) {
  clear();
  $("status").textContent = `loading ${mission}…`;
  const meta = await (await fetch(base + `${mission}.json`)).json();
  const raw = new Uint16Array(await (await fetch(base + `${mission}.bin`)).arrayBuffer());
  const n = raw.length / 3, pos = new Float32Array(raw.length), col = new Float32Array(raw.length);
  for (let i = 0; i < raw.length; i++) pos[i] = meta.origin[i % 3] + raw[i] * meta.step;
  const zs = []; for (let i = 2; i < pos.length; i += 3 * 50) zs.push(pos[i]);
  zs.sort((a, b) => a - b);
  zRange = [zs[Math.floor(zs.length * 0.02)], zs[Math.floor(zs.length * 0.98)]];   // colour scale
  zLimits = [zs[0], zs[zs.length - 1]];                                                // height-cut slider span
  for (let i = 0; i < n; i++) {
    const c = turbo((pos[3 * i + 2] - zRange[0]) / (zRange[1] - zRange[0]));
    col.set(c, 3 * i);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  mapPoints = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.04, vertexColors: true }));
  scene.add(mapPoints);

  $("tracks").innerHTML = "";
  for (const [name, line] of Object.entries(meta.tracks)) {
    const segs = [[]];
    for (const p of line) { if (p === null) segs.push([]); else segs[segs.length - 1].push(p); }
    const colour = name === "GT prism" ? "#e6edf3" : meta.colours[name];       // GT is near-black: light on dark
    trackLines[name] = segs.filter((s) => s.length > 1).map((s) => {
      const g = new LineGeometry(); g.setPositions(s.flat());
      const l = new Line2(g, new LineMaterial({ color: colour, linewidth: name === "GT prism" ? 4 : 2.5,
                                                 resolution: new THREE.Vector2(innerWidth, innerHeight) }));
      scene.add(l); return l;
    });
    const row = document.createElement("label");
    row.innerHTML = `<input type="checkbox" checked> <span class="swatch" style="background:${colour}"></span>${name}`;
    row.querySelector("input").onchange = (e) => trackLines[name].forEach((l) => (l.visible = e.target.checked));
    $("tracks").appendChild(row);
  }

  // Frame the GT path (stray far points would inflate a bounding sphere), and cut the ceiling 1.5 m above it.
  const gt = meta.tracks["GT prism"].filter((p) => p !== null);
  const box = new THREE.Box3().setFromPoints(gt.map((p) => new THREE.Vector3(...p)));
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(5, box.getSize(new THREE.Vector3()).length());
  controls.target.copy(c);
  camera.position.set(c.x - 0.5 * r, c.y - 0.8 * r, c.z + 0.8 * r);
  camera.far = 50 * r; camera.updateProjectionMatrix();
  $("zcut").value = Math.round(1000 * (box.max.z + 1.5 - zLimits[0]) / (zLimits[1] - zLimits[0]));
  applyControls();
  $("status").textContent = `${n.toLocaleString()} points · ${meta.frame}`;
  history.replaceState(null, "", `?exp=${exp}&mission=${mission}`);
}

function applyControls() {
  if (!mapPoints) return;
  mapPoints.visible = $("showmap").checked;
  mapPoints.material.size = $("size").value / 300;
  const cut = zLimits[0] + ($("zcut").value / 1000) * (zLimits[1] - zLimits[0]);
  mapPoints.material.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, 0, -1), cut)];
}
renderer.localClippingEnabled = true;
for (const id of ["zcut", "size", "showmap"]) $(id).oninput = applyControls;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  Object.values(trackLines).flat().forEach((l) => l.material.resolution.set(innerWidth, innerHeight));
}
addEventListener("resize", resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

try {
  const index = await (await fetch(base + "index.json")).json();
  $("title").textContent = `${index.experiment} · 3D viewer`;
  $("subtitle").textContent = index.title;
  $("report").href = index.report;
  for (const m of index.missions) $("mission").add(new Option(m, m));
  const start = index.missions.includes(params.get("mission")) ? params.get("mission") : index.missions[0];
  $("mission").value = start;
  $("mission").onchange = (e) => load(e.target.value);
  await load(start);
} catch (err) {
  $("status").textContent = `No viewer data for ${exp} yet (run \`lvx viewer ${exp}\` on the host).`;
}
</script>
</body>
</html>
