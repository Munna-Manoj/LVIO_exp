id: EXP-020
slug: map-structure-speed
title: Does the map data structure set the speed?
phase: P3
status: planned
created: '2026-10-07'
system:
- se3-lvio
- lightning-lm
depends_on:
- EXP-000
- EXP-016
supersedes: null
host: reference
question: SE(3)-LVIO stores planes with their uncertainty in a VoxelMap; lightning-lm stores points in
  iVox and fits a plane to the 5 nearest points on the fly. If each system gets the other's map, how do
  scan time and ATE change?
hypothesis: VoxelMap pays for each plane's uncertainty (an eigen-decomposition and covariance update per
  voxel) but gives better residual weights. iVox makes insertion and lookup cheaper (hashing, no plane
  refits) but its equally weighted planes are noisier. Speed and accuracy trade against each other.
prediction: 'SE(3)-LVIO with iVox: ms_p95 20 to 40 % lower, and ATE worse by more than the noise floor
  on at least two dev missions. lightning-lm with VoxelMap, on ARC-6: ms_p95 higher and ATE better.'
falsified_if: SE(3)-LVIO with iVox is not faster beyond timing noise, or it is both faster and at least
  as accurate (the map structure would then be a free speed-up).
baseline: se3lvio_S8
variants:
- id: ivox
  change: 'SE(3)-LVIO: iVox map (hashed voxels, plane fit to the 5 nearest points, covariance from the
    fit residual) instead of VoxelMap'
  overrides:
    lio.map_backend: ivox
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_voxelmap
  change: 'lightning-lm: VoxelMap (planes with uncertainty) instead of iVox'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.map_backend: voxelmap
code_change: 'SE(3)-LVIO: new flag `map_backend` {voxelmap, ivox} (default voxelmap); iVox is written
  from the Faster-LIO paper, not copied from lightning-lm. lightning-lm: new flag `map_backend` in its
  fork, default ivox; voxelmap is written from the VoxelMap paper. The flag is added to the fork before
  this experiment is frozen; its default reproduces the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ms_p95
  secondary:
  - ms_mean
  - rss_mb
  - ate_rmse_cm
  - ate_max_cm
stress: null
decision_rule: 'A speed and accuracy trade-off, judged for each system. SE(3)-LVIO: adopt iVox if it cuts
  ms_p95 by more than 10 % and ATE is within the noise floor on every dev mission; reject if ATE is worse
  by more than the noise floor on any mission; otherwise inconclusive, with the measured trade-off. lightning-lm
  (ARC-6 only): adopt VoxelMap if ATE is better by more than the noise floor with less than 20 % more
  ms_p95; reject if ATE is worse; otherwise inconclusive. Verdict: adopt if both systems adopt their variant,
  reject if both reject, and inconclusive otherwise.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: VoxelMap
  meaning: 'SE(3)-LVIO''s map: each voxel stores a plane and the plane''s uncertainty, refitted as points
    arrive.'
- term: iVox
  meaning: 'lightning-lm''s map: a hash table of voxels that stores points; a plane is fitted to a scan
    point''s 5 nearest map points at query time.'
participation:
- system: se3-lvio
  takes_part: true
  how: VoxelMap is replaced by iVox.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO's map also keeps the point candidates its point-to-point residual needs. iVox has no such
    candidates, so the swap would be two changes.
- system: lightning-lm
  takes_part: true
  how: iVox is replaced by VoxelMap.
