id: EXP-010
slug: state-17-vs-12
title: Does estimating accelerometer bias and gravity online pay off?
phase: P4
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: Does the 17-dim state (with accel bias and S2 gravity) beat a 12-dim state with them fixed after
  initialisation, as in lightning-lm?
hypothesis: Accel bias and gravity direction are weakly observable but matter when the start is not static;
  fixing them saves compute and removes a source of drift-by-misestimation.
prediction: 'Within noise on missions with a static start; 17-dim better on missions that start moving.
  GenZ-LIO: the same as SE(3)-LVIO.'
falsified_if: 12-dim better beyond noise on most missions.
baseline: se3lvio_S8
variants:
- id: state12
  change: freeze ba and gravity after initialisation (zero their process noise and gain)
  overrides:
    lio.freeze_ba_gravity: true
- id: genz
  change: swap baseline config to GenZ-LIO stock (the reference of the GenZ-LIO arms)
  baseline: genz_stock
- id: genz_state12
  change: 'GenZ-LIO: freeze ba and gravity after initialisation (zero their process noise and gain)'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.freeze_ba_gravity: true
code_change: 'new flag freeze_ba_gravity (default false); GenZ-LIO: the same flag as `lvio_exp.freeze_ba_gravity`
  in the fork (default off = upstream), added before freezing'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive. Applied to each system
  separately: SE(3)-LVIO''s arms against `baseline`, GenZ-LIO''s against `genz`, each with its own noise
  floor (EXP-000, EXP-022). The verdict is adopt if the rule adopts for both systems, reject if it rejects
  for both, otherwise inconclusive; the TL;DR gives both (ADR-0012 addendum).'
learn_links: []
