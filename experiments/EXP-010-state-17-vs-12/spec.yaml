id: EXP-010
slug: state-17-vs-12
title: Does estimating accelerometer bias and gravity online pay off?
phase: P4
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
supersedes: null
host: reference
question: Does estimating the accelerometer bias and the gravity direction during the run, instead of
  fixing them after start-up, change ATE?
hypothesis: The accelerometer bias and the gravity direction are weakly observable. They matter when the
  robot does not start standing still. Fixing them saves computation and removes drift caused by wrong
  estimates.
prediction: On missions that start standing still, ATE changes by less than the noise floor in all three
  systems. On missions that start moving, the side that estimates them is better.
falsified_if: In any system, fixing them is better by more than the noise floor on a mission that starts
  moving.
baseline: se3lvio_S8
variants:
- id: state12
  change: 'SE(3)-LVIO: fix the accelerometer bias and gravity after start-up'
  overrides:
    lio.freeze_ba_gravity: true
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_state12
  change: 'GenZ-LIO: fix the accelerometer bias and gravity after start-up'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.freeze_ba_gravity: true
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_state17
  change: 'lightning-lm: estimate the accelerometer bias and gravity during the run'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.estimate_ba_gravity: true
code_change: 'SE(3)-LVIO: new flag `freeze_ba_gravity` (default false): their process noise and gain are
  set to zero after start-up. GenZ-LIO: new flag `freeze_ba_gravity` in its fork, default false. lightning-lm:
  new flag `estimate_ba_gravity` in its fork, default false; adds the accelerometer bias and gravity to
  its 12-dimensional error state. The flag is added to the fork before this experiment is frozen; its
  default reproduces the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without estimating them during the run (SE(3)-LVIO: `baseline`
  with it, `state12` without it; GenZ-LIO: `genz` with it, `genz_state12` without it; lightning-lm: `lightning_state17`
  with it, `lightning` without it). On each mission, the side with estimating them during the run is better
  if its ATE is lower by more than the noise floor, and worse if its ATE is higher by more than the noise
  floor. Estimating them during the run helps a system if the side with it is better on at least two of
  the three dev missions, worse on none, and its ms_p95 is less than 10 % higher. Estimating them during
  the run hurts a system if the side with it is worse on any mission. For lightning-lm only ARC-6 is judged:
  estimating them during the run helps lightning-lm if the side with it is better on ARC-6 with less than
  10 % more ms_p95, and hurts lightning-lm if it is worse on ARC-6. Verdict: adopt if estimating them
  during the run helps every system that takes part, reject if it hurts every one, and inconclusive otherwise.
  The summary at the top of the page gives the result for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: error state
  meaning: 'The quantities the filter corrects at each scan. SE(3)-LVIO: 17 dimensions (pose, velocity,
    gyroscope bias, accelerometer bias, gravity direction). lightning-lm: 12 (pose, velocity, gyroscope
    bias); it fixes gravity at start-up and has no accelerometer bias.'
participation:
- system: se3-lvio
  takes_part: true
  how: SE(3)-LVIO estimates both; its variant fixes them.
- system: genz-lio
  takes_part: true
  how: GenZ-LIO estimates both; its variant fixes them.
- system: lightning-lm
  takes_part: true
  how: lightning-lm fixes gravity and has no accelerometer bias; its variant estimates both.
