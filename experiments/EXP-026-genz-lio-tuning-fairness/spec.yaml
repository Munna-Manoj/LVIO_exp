id: EXP-026
slug: genz-lio-tuning-fairness
title: Is GenZ-LIO tuned fairly?
phase: PX
status: planned
created: '2026-10-13'
system: genz-lio
depends_on:
- EXP-022
supersedes: null
host: reference
question: With the same dev-split tuning budget SE(3)-LVIO had, how close does GenZ-LIO get?
hypothesis: Most of the SNOW-3 gap to SE(3)-LVIO S8 (5.602 vs 1.265 cm) comes from the state and map design,
  not from tuning; tuning closes at most a third of it.
prediction: No variant brings SNOW-3 below 4.2 cm (a third of the gap); the best variant within 0.3 cm
  of genz_stock on ARC-6.
falsified_if: a tuned GenZ-LIO matches SE(3)-LVIO S8 within noise on SNOW-3.
baseline: genz_stock
variants:
- id: lambda_po_0p02
  change: λ_po 0.02 (stock 0.05)
  overrides:
    hybrid_metric.lambda_po: 0.02
- id: lambda_po_0p2
  change: λ_po 0.2 (stock 0.05)
  overrides:
    hybrid_metric.lambda_po: 0.2
- id: voxel_0p5
  change: root voxel 0.5 m (stock 1.0)
  overrides:
    mapping.voxel_size: 0.5
code_change: none (config only)
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive.
learn_links: []
