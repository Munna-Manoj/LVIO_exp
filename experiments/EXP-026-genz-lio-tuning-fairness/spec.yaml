id: EXP-026
slug: genz-lio-tuning-fairness
title: Is GenZ-LIO tuned fairly?
phase: PX
status: planned
created: '2026-10-13'
system: genz-lio
depends_on:
- EXP-022
supersedes: null
host: reference
question: With the same tuning budget on the dev missions that SE(3)-LVIO had, how close does GenZ-LIO
  get to SE(3)-LVIO?
hypothesis: Most of the SNOW-3 gap between GenZ-LIO (5.60 cm, EXP-022) and SE(3)-LVIO S8 (1.26 cm, EXP-000)
  comes from the state and the map design, not from tuning. Tuning closes at most a third of the gap.
prediction: No variant brings GenZ-LIO's SNOW-3 ATE below 4.2 cm (a third of the gap closed). The best
  variant is within 0.3 cm of GenZ-LIO's stock config on ARC-6.
falsified_if: A tuned GenZ-LIO matches SE(3)-LVIO S8's SNOW-3 ATE within the noise floor.
baseline: genz_stock
variants:
- id: lambda_po_0p02
  change: 'GenZ-LIO: λ_po 0.02 (stock 0.05)'
  overrides:
    hybrid_metric.lambda_po: 0.02
- id: lambda_po_0p2
  change: 'GenZ-LIO: λ_po 0.2 (stock 0.05)'
  overrides:
    hybrid_metric.lambda_po: 0.2
- id: voxel_0p5
  change: 'GenZ-LIO: root voxel 0.5 m (stock 1.0 m)'
  overrides:
    mapping.voxel_size: 0.5
code_change: None (config only).
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: Adopt the variant with the lowest mean ATE as GenZ-LIO's tuned config if it is better than
  the stock config by more than the noise floor on at least two dev missions, worse on none, with less
  than 10 % more ms_p95. Reject (the stock config stays) if every variant is worse on at least one dev
  mission. Otherwise inconclusive.
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (genz_stock)'
  meaning: 'GenZ-LIO''s stock config: upstream''s Hesai settings, with only the sensor calibration and
    the 4-core limit set.'
- term: λ_po
  meaning: GenZ-LIO's weight factor for point-to-point residuals against point-to-plane ones; upstream
    calls it its most sensitive parameter.
- term: root voxel
  meaning: The size of the largest cube in GenZ-LIO's octree map.
participation:
- system: se3-lvio
  takes_part: false
  how: SE(3)-LVIO's stock config was tuned by its authors on these sensors; it is the comparison point.
- system: genz-lio
  takes_part: true
  how: Three config changes, one at a time.
- system: lightning-lm
  takes_part: false
  how: lightning-lm's tuning fairness is EXP-019.
