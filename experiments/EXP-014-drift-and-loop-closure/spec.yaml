id: EXP-014
slug: drift-and-loop-closure
title: Is there drift worth closing loops for?
phase: P5
status: planned
created: '2026-10-07'
system:
- se3-lvio
- lightning-lm
depends_on:
- EXP-000
supersedes: null
host: reference
question: How much does each system drift without loop closure, and does adding loop closure reduce ATE?
hypothesis: On short indoor missions the drift is millimetres, and SE(3)-LVIO's plane bundle adjustment
  already closes small loops. Loop closure helps only on long missions that revisit places.
prediction: 'SE(3)-LVIO: ATE changes by less than the noise floor on ARC-6; better only on long missions
  with revisits (to be identified). lightning-lm, on ARC-6: ATE changes by less than the noise floor.'
falsified_if: Loop closure improves ATE by more than the noise floor on a mission without revisits. That
  would mean the loop factor does something other than close loops.
baseline: se3lvio_S9c
variants:
- id: loop_closure
  change: 'SE(3)-LVIO S9c: loop closure added to the backend (candidates by distance, checked by point-to-plane
    alignment, added as a factor in iSAM2)'
  overrides:
    backend.loop_closure: 1
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_loop
  change: 'lightning-lm: its own loop closure and pose graph switched on'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.loop_closure: true
code_change: 'SE(3)-LVIO: new backend flag `loop_closure` (default 0), written from published descriptions,
  not copied from lightning-lm. lightning-lm: new flag `loop_closure` in its fork and our runner (default
  false), which runs lightning-lm''s existing loop closure. The flag is added to the fork before this
  experiment is frozen; its default reproduces the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without loop closure (SE(3)-LVIO: `loop_closure` with it,
  `baseline` without it; lightning-lm: `lightning_loop` with it, `lightning` without it). On each mission,
  the side with loop closure is better if its ATE is lower by more than the noise floor, and worse if
  its ATE is higher by more than the noise floor. Loop closure helps a system if the side with it is better
  on at least two of the three dev missions, worse on none, and its ms_p95 is less than 10 % higher. Loop
  closure hurts a system if the side with it is worse on any mission. For lightning-lm only ARC-6 is judged:
  loop closure helps lightning-lm if the side with it is better on ARC-6 with less than 10 % more ms_p95,
  and hurts lightning-lm if it is worse on ARC-6. Verdict: adopt if loop closure helps every system that
  takes part, reject if it hurts every one, and inconclusive otherwise. The summary at the top of the
  page gives the result for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: '`baseline` (S9c)'
  meaning: 'SE(3)-LVIO''s full config `se3lvio_S9c`: S9b plus the online backend (plane bundle adjustment
    and iSAM2). It is SE(3)-LVIO''s COMFORT leaderboard config.'
- term: loop closure
  meaning: Recognising a place seen before and adding a constraint between the two visits, so that accumulated
    drift is removed.
- term: '`lightning` with its backend'
  meaning: lightning-lm also has loop closure and a pose graph. The LIO runner used in this study does
    not run them; EXP-014 adds them.
participation:
- system: se3-lvio
  takes_part: true
  how: Loop closure is added to its backend.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO has no backend to add loop closure to.
- system: lightning-lm
  takes_part: true
  how: lightning-lm's own loop closure is switched on.
