code_change: 'None: every key exists. SE(3)-LVIO `downsample_target_inliers`; GenZ-LIO `adaptive_voxelization.min_points`
  and `max_points`; lightning-lm `fasterlio.filter_size_scan`.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ms_mean
  - ms_p95
  - rss_mb
stress: null
decision_rule: 'Applied to each system separately. Adopt a smaller budget as that system''s new default
  if its ATE is not worse than the stock budget''s by more than the noise floor on any judged mission
  and it cuts ms_p95 by at least 10 %; if several qualify, the smallest is adopted. Keep the stock budget
  (reject) if no smaller budget qualifies. The result is inconclusive for a system if a larger budget
  improves ATE by more than the noise floor on at least two of the three dev missions (lightning-lm: on
  ARC-6); a follow-up experiment then chooses a new default. For lightning-lm only ARC-6 is judged. Verdict:
  adopt if every system adopts a smaller budget, reject if every system keeps its stock budget, and inconclusive
  otherwise. The summary at the top gives each system''s result.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: point budget
  meaning: The number of LiDAR points a system keeps from each scan after downsampling.
- term: downsampling
  meaning: Thinning a scan by merging the points that fall in the same cube (voxel) of a grid. A larger
    voxel keeps fewer points.
- term: how each system sets its budget
  meaning: SE(3)-LVIO adjusts its voxel size after every scan so that about 2000 points match a plane.
    GenZ-LIO adjusts its voxel size so that it keeps 1000 points in confined scenes, rising to 4000 in
    open ones. lightning-lm uses a fixed 0.2 m voxel; on surfaces the number of points kept scales with
    1 / voxel², so its voxel sizes are chosen to give about the same factors.
participation:
- system: se3-lvio
  takes_part: true
  how: 'Its target number of points is swept: 500, 1000, 3000, 4000.'
- system: genz-lio
  takes_part: true
  how: Its minimum and maximum are scaled together by 0.25, 0.5, 1.5 and 2.
- system: lightning-lm
  takes_part: true
  how: 'Its fixed scan voxel is swept: 0.40, 0.28, 0.16, 0.14 m.'
