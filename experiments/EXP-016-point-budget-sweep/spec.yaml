id: EXP-016
slug: point-budget-sweep
title: How much accuracy does each millisecond of scan time buy?
phase: P7
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
supersedes: null
host: reference
question: When each system keeps fewer or more points per scan, how do its ATE and its scan time change?
hypothesis: 'More points give the system more planes to align each scan to, so ATE falls as the point
  budget grows. Beyond some budget, the scan is already aligned as well as the data allow: ATE stops falling,
  while scan time keeps growing roughly in proportion to the number of points.'
prediction: 'SE(3)-LVIO: compared with its stock 2000 points, ATE changes by less than the noise floor
  at 1000, 3000 and 4000 points, and is worse at 500. GenZ-LIO: compared with its stock budget, ATE changes
  by less than the noise floor at 0.5×, 1.5× and 2× that budget, and is worse at 0.25×. lightning-lm,
  on ARC-6: the same pattern over the same factors. All three: ms_p95 grows roughly in proportion to the
  point budget.'
falsified_if: In any system, a budget larger than the stock one improves ATE by more than the noise floor
  on every judged mission. That would mean the stock budget is too small.
baseline: se3lvio_S8
variants:
- id: n500
  change: 'SE(3)-LVIO: 500 points per scan (stock 2000)'
  overrides:
    lio.downsample_target_inliers: 500
- id: n1000
  change: 'SE(3)-LVIO: 1000 points per scan (stock 2000)'
  overrides:
    lio.downsample_target_inliers: 1000
- id: n3000
  change: 'SE(3)-LVIO: 3000 points per scan (stock 2000)'
  overrides:
    lio.downsample_target_inliers: 3000
- id: n4000
  change: 'SE(3)-LVIO: 4000 points per scan (stock 2000)'
  overrides:
