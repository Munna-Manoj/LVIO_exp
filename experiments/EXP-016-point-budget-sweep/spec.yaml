id: EXP-016
slug: point-budget-sweep
title: How much accuracy does each millisecond buy?
phase: P7
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: How do ATE and ms/scan change as the adaptive downsampling target moves from 500 to 4000 inliers?
hypothesis: Accuracy saturates once planes are well covered; time grows roughly linearly with inliers.
prediction: 'ATE flat from 1000 to 4000, worse at 500; ms_p95 roughly linear. GenZ-LIO, the same factors
  on its N_min/N_max: ATE flat from ×0.5 to ×2, worse at ×0.25; ms_p95 roughly linear.'
falsified_if: ATE keeps improving beyond 2000 (the default is under-sampled).
baseline: se3lvio_S8
variants:
- id: n500
  change: downsample target 500 inliers (baseline 2000)
  overrides:
    lio.downsample_target_inliers: 500
- id: n1000
  change: downsample target 1000 inliers (baseline 2000)
  overrides:
    lio.downsample_target_inliers: 1000
- id: n3000
  change: downsample target 3000 inliers (baseline 2000)
  overrides:
    lio.downsample_target_inliers: 3000
- id: n4000
  change: downsample target 4000 inliers (baseline 2000)
  overrides:
    lio.downsample_target_inliers: 4000
- id: genz
  change: swap baseline config to GenZ-LIO stock (the reference of the GenZ-LIO arms)
  baseline: genz_stock
- id: genz_x0p25
  change: GenZ-LIO point budget ×0.25 (N_min/N_max 250/1000, stock 1000/4000)
  baseline: genz_stock
  reference: genz
  overrides:
    adaptive_voxelization.min_points: 250
    adaptive_voxelization.max_points: 1000
  single_change_reason: GenZ-LIO's budget is the pair N_min/N_max; both scale by the same factor, as SE(3)-LVIO's
    single target does
- id: genz_x0p5
  change: GenZ-LIO point budget ×0.5 (N_min/N_max 500/2000, stock 1000/4000)
  baseline: genz_stock
  reference: genz
  overrides:
    adaptive_voxelization.min_points: 500
    adaptive_voxelization.max_points: 2000
  single_change_reason: GenZ-LIO's budget is the pair N_min/N_max; both scale by the same factor, as SE(3)-LVIO's
    single target does
- id: genz_x1p5
  change: GenZ-LIO point budget ×1.5 (N_min/N_max 1500/6000, stock 1000/4000)
  baseline: genz_stock
  reference: genz
  overrides:
    adaptive_voxelization.min_points: 1500
    adaptive_voxelization.max_points: 6000
  single_change_reason: GenZ-LIO's budget is the pair N_min/N_max; both scale by the same factor, as SE(3)-LVIO's
    single target does
- id: genz_x2
  change: GenZ-LIO point budget ×2 (N_min/N_max 2000/8000, stock 1000/4000)
  baseline: genz_stock
  reference: genz
  overrides:
    adaptive_voxelization.min_points: 2000
    adaptive_voxelization.max_points: 8000
  single_change_reason: GenZ-LIO's budget is the pair N_min/N_max; both scale by the same factor, as SE(3)-LVIO's
    single target does
code_change: 'none (existing field downsample_target_inliers); GenZ-LIO: none (existing keys adaptive_voxelization.min_points/max_points)'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ms_mean
  - ms_p95
  - rss_mb
stress: null
decision_rule: 'adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive. Applied to each system
  separately: SE(3)-LVIO''s arms against `baseline`, GenZ-LIO''s against `genz`, each with its own noise
  floor (EXP-000, EXP-022). The verdict is adopt if the rule adopts for both systems, reject if it rejects
  for both, otherwise inconclusive; the TL;DR gives both (ADR-0012 addendum).'
learn_links: []
