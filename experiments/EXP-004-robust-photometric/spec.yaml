id: EXP-004
slug: robust-photometric
title: Does a robust kernel on the camera residuals make the camera useful?
phase: P5
status: planned
created: '2026-10-07'
system: se3-lvio
depends_on:
- EXP-000
supersedes: null
host: reference
question: SE(3)-LVIO's camera update drops an image patch whose brightness error is above a hard limit.
  Does a Huber weight on the brightness error instead let the camera improve ATE?
hypothesis: 'The camera currently adds nothing: on ARC-6, S9b with the camera has ATE 0.90 cm and S9a
  without the camera 0.89 cm (EXP-000). Dark and smoky patches pass the hard limit and pull the pose the
  wrong way. A Huber weight reduces their pull.'
prediction: S9b with Huber weights reaches or beats S9a's ATE.
falsified_if: Huber weights leave the gap between S9b and S9a unchanged.
baseline: se3lvio_S9b
variants:
- id: photo_huber
  change: 'SE(3)-LVIO S9b: Huber weight on the camera residuals'
  overrides:
    lio.visual.robust_kernel: huber
code_change: 'SE(3)-LVIO: new flag `visual.robust_kernel` {none, huber} (default none).'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without the Huber weight on camera residuals (SE(3)-LVIO:
  `photo_huber` with it, `baseline` without it). On each mission, the side with the Huber weight on camera
  residuals is better if its ATE is lower by more than the noise floor, and worse if its ATE is higher
  by more than the noise floor. The Huber weight on camera residuals helps a system if the side with it
  is better on at least two of the three dev missions, worse on none, and its ms_p95 is less than 10 %
  higher. The Huber weight on camera residuals hurts a system if the side with it is worse on any mission.
  Verdict: adopt if the Huber weight on camera residuals helps every system that takes part, reject if
  it hurts every one, and inconclusive otherwise. The summary at the top of the page gives the result
  for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S9b)'
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9b`: two LiDARs (Hesai and Livox), the IMU and the front camera.'
- term: S9a
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9a`: two LiDARs and the IMU, no camera.'
- term: camera residual
  meaning: The brightness difference between an image patch and the same patch predicted from the map.
participation:
- system: se3-lvio
  takes_part: true
  how: Huber weight on its camera residuals.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO uses no camera.
- system: lightning-lm
  takes_part: false
  how: lightning-lm uses no camera.
