id: EXP-015
slug: gnc-pgo-false-loops
title: Does GNC protect the pose graph from false loops?
phase: P6
status: planned
created: '2026-10-07'
system: se3-lvio
depends_on:
- EXP-014
supersedes: null
host: reference
question: With 1-3 injected false loop closures, does GNC (gtsam::GncOptimizer) keep ATE at the clean
  level where plain Huber does not?
hypothesis: A single false loop can bend a pose graph; GNC-TLS is designed for exactly this case (poor
  initial guess for the outlier factor, high leverage).
prediction: 'Huber: ATE grows with injected loops. GNC: within noise of the clean run.'
falsified_if: GNC also degrades beyond noise with one injected loop.
baseline: se3lvio_S9c
variants:
- id: huber_pgo
  change: loop factors with Huber kernel
  overrides:
    backend.loop_kernel: huber
- id: gnc_pgo
  change: loop factors solved with GncOptimizer (TLS)
  overrides:
    backend.loop_kernel: gnc
code_change: new backend flag loop_kernel {huber,gnc}; stress profile injects false loops
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: false-loops-3
decision_rule: adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive.
learn_links: []
