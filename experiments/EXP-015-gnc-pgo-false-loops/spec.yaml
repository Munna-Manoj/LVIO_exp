id: EXP-015
slug: gnc-pgo-false-loops
title: Does GNC protect the pose graph from false loops?
phase: P6
status: planned
created: '2026-10-07'
system: se3-lvio
depends_on:
- EXP-014
supersedes: null
host: reference
question: When 1 to 3 false loop closures are injected, does GNC (gtsam::GncOptimizer) keep ATE at the
  clean level where a Huber kernel does not?
hypothesis: 'A single false loop can bend a pose graph. GNC-TLS is designed for exactly this case: the
  false factor starts far from its true value and has high leverage.'
prediction: With Huber, ATE grows with each injected loop. With GNC, ATE changes by less than the noise
  floor compared with the clean run.
falsified_if: With GNC, ATE is worse than the clean run by more than the noise floor after one injected
  loop.
baseline: se3lvio_S9c
variants:
- id: huber_pgo
  change: 'SE(3)-LVIO S9c: loop factors with a Huber kernel'
  overrides:
    backend.loop_kernel: huber
- id: gnc_pgo
  change: 'SE(3)-LVIO S9c: loop factors solved with GncOptimizer (TLS)'
  overrides:
    backend.loop_kernel: gnc
code_change: 'SE(3)-LVIO: new backend flag `loop_kernel` {huber, gnc}. The stress profile `false-loops-3`
  injects the false loops.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: false-loops-3
decision_rule: Compare each variant with the clean run (no injected loops) on each dev mission. Adopt
  GNC if `gnc_pgo` is within the noise floor of the clean run on every mission while `huber_pgo` is worse
  by more than the noise floor on at least one. Reject GNC if `gnc_pgo` is also worse by more than the
  noise floor on any mission. Otherwise inconclusive.
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S9c)'
  meaning: 'SE(3)-LVIO''s full config `se3lvio_S9c`: S9b plus the online backend (plane bundle adjustment
    and iSAM2).'
- term: false loop
  meaning: A loop closure between two places that are not the same, added on purpose by the stress profile.
- term: GNC
  meaning: 'Graduated non-convexity: the solver starts by trusting every factor a little and gradually
    gives factors that disagree with the rest a weight of 0.'
participation:
- system: se3-lvio
  takes_part: true
  how: Huber and GNC kernels on its loop factors.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO has no backend.
- system: lightning-lm
  takes_part: false
  how: 'Not yet: this needs lightning-lm''s loop closure running in our harness, which EXP-014 adds. A
    later experiment can add it.'
