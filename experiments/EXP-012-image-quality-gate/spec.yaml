id: EXP-012
slug: image-quality-gate
title: Does skipping bad camera frames make the camera pay for itself?
phase: P5
status: planned
created: '2026-10-07'
system: se3-lvio
depends_on:
- EXP-004
supersedes: null
host: reference
question: Does skipping SE(3)-LVIO's camera update on dark or low-texture frames improve ATE and scan
  time?
hypothesis: Dark or featureless frames give camera residuals that pull the pose the wrong way. Skipping
  them keeps the useful frames and saves time.
prediction: 'S9b with the frame check: ATE at most S9a''s (no camera), and ms_p95 lower than S9b''s.'
falsified_if: ATE changes by less than the noise floor and ms_p95 does not drop.
baseline: se3lvio_S9b
variants:
- id: img_gate
  change: 'SE(3)-LVIO S9b: skip the camera update if the mean brightness is below 25 or the image gradient
    energy is below its 10th percentile'
  overrides:
    lio.visual.quality_gate: true
code_change: 'SE(3)-LVIO: new flag `visual.quality_gate` (default false).'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without the frame check (SE(3)-LVIO: `img_gate` with it, `baseline`
  without it). On each mission, the side with the frame check is better if its ATE is lower by more than
  the noise floor, and worse if its ATE is higher by more than the noise floor. The frame check helps
  a system if the side with it is better on at least two of the three dev missions, worse on none, and
  its ms_p95 is less than 10 % higher. The frame check hurts a system if the side with it is worse on
  any mission. Verdict: adopt if the frame check helps every system that takes part, reject if it hurts
  every one, and inconclusive otherwise. The summary at the top of the page gives the result for each
  system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S9b)'
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9b`: two LiDARs (Hesai and Livox), the IMU and the front camera.'
- term: S9a
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9a`: two LiDARs and the IMU, no camera.'
participation:
- system: se3-lvio
  takes_part: true
  how: The frame check is added to its camera update.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO uses no camera.
- system: lightning-lm
  takes_part: false
  how: lightning-lm uses no camera.
