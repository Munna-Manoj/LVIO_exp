id: EXP-011
slug: online-time-offset-lever-arm
title: Can online estimation replace hand-fitted calibration?
phase: P4
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: Does estimating the IMU time offset online match the hand-fitted per-mission imu_dt?
hypothesis: The time offset is observable from rotation; online estimation removes a manual fitting step
  without losing accuracy.
prediction: 'Within noise of the hand-fitted imu_dt; converged offset within 1 ms of the fitted value.
  GenZ-LIO: the same converged offset (it is a property of the sensors, not of the estimator); ATE within
  noise of `genz`.'
falsified_if: worse beyond noise, or the estimate does not converge within 30 s.
baseline: se3lvio_S8
variants:
- id: td_online
  change: estimate IMU time offset in the state, start at 0
  overrides:
    lio.estimate_time_offset: true
- id: genz
  change: swap baseline config to GenZ-LIO stock (the reference of the GenZ-LIO arms)
  baseline: genz_stock
- id: genz_td_online
  change: 'GenZ-LIO: estimate the IMU time offset in the state, start at 0'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.estimate_time_offset: true
code_change: 'new flag estimate_time_offset (default false); lever-arm estimation is a later experiment
  if this works; GenZ-LIO: the same flag as `lvio_exp.estimate_time_offset` in the fork (default off =
  upstream), added before freezing (a time-offset state in its IKFoM manifold)'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive. Applied to each system
  separately: SE(3)-LVIO''s arms against `baseline`, GenZ-LIO''s against `genz`, each with its own noise
  floor (EXP-000, EXP-022). The verdict is adopt if the rule adopts for both systems, reject if it rejects
  for both, otherwise inconclusive; the TL;DR gives both (ADR-0012 addendum).'
learn_links: []
