id: EXP-003
slug: gnc-tls-iekf
title: Does gradually rejecting outliers across the update iterations help?
phase: P1
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-002
supersedes: null
host: reference
question: Does GNC-TLS weighting, which starts permissive and becomes strict over the update iterations,
  improve ATE compared with each system's stock weighting?
hypothesis: In the first iteration the pose is still off, so a strict rule rejects good points. GNC-TLS
  starts with a wide acceptance and narrows it as the pose improves. With only 4 iterations per scan,
  the schedule may not finish.
prediction: 'All three systems: GNC-TLS with the stock iteration count changes ATE by less than the noise
  floor. GNC-TLS with 8 iterations improves ATE on ARC-6 and costs more scan time.'
falsified_if: GNC-TLS with 8 iterations is not better than the stock config on ARC-6 in any system.
baseline: se3lvio_S8
variants:
- id: gnc_tls
  change: 'SE(3)-LVIO: GNC-TLS weights, μ × 1.4 per iteration'
  overrides:
    lio.robust_kernel: gnc_tls
- id: gnc_tls_8it
  change: 'SE(3)-LVIO: GNC-TLS weights with 8 iterations, so that the schedule finishes'
  overrides:
    lio.robust_kernel: gnc_tls_8it
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_gnc_tls
  change: 'GenZ-LIO: GNC-TLS weights, μ × 1.4 per iteration'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.robust_kernel: gnc_tls
- id: genz_gnc_tls_8it
  change: 'GenZ-LIO: GNC-TLS weights with 8 iterations'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.robust_kernel: gnc_tls_8it
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_gnc_tls
  change: 'lightning-lm: GNC-TLS weights, μ × 1.4 per iteration'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.robust_kernel: gnc_tls
- id: lightning_gnc_tls_8it
  change: 'lightning-lm: GNC-TLS weights with 8 iterations'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.robust_kernel: gnc_tls_8it
code_change: 'All three systems: the flag `robust_kernel` from EXP-002 gains the values gnc_tls and gnc_tls_8it
  (the second also sets the iteration count to 8 inside the flag). The flag is added to the fork before
  this experiment is frozen; its default reproduces the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without GNC-TLS weighting (SE(3)-LVIO: `gnc_tls or gnc_tls_8it`
  with it, `baseline` without it; GenZ-LIO: `genz_gnc_tls or genz_gnc_tls_8it` with it, `genz` without
  it; lightning-lm: `lightning_gnc_tls or lightning_gnc_tls_8it` with it, `lightning` without it). On
  each mission, the side with GNC-TLS weighting is better if its ATE is lower by more than the noise floor,
  and worse if its ATE is higher by more than the noise floor. GNC-TLS weighting helps a system if the
  side with it is better on at least two of the three dev missions, worse on none, and its ms_p95 is less
  than 10 % higher. GNC-TLS weighting hurts a system if the side with it is worse on any mission. For
  lightning-lm only ARC-6 is judged: GNC-TLS weighting helps lightning-lm if the side with it is better
  on ARC-6 with less than 10 % more ms_p95, and hurts lightning-lm if it is worse on ARC-6. Verdict: adopt
  if GNC-TLS weighting helps every system that takes part, reject if it hurts every one, and inconclusive
  otherwise. The summary at the top of the page gives the result for each system. A system''s better variant
  (lower mean ATE) stands for that system.'
learn_links:
- docs/explain/outliers-in-an-iekf.md
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: GNC-TLS
  meaning: Graduated non-convexity with a truncated least-squares cost. Each residual gets a weight between
    0 and 1. The parameter μ starts small, which accepts almost every point, and grows by × 1.4 per iteration
    until large residuals get weight 0.
- term: iteration
  meaning: One pass of the scan update. Each scan is re-matched and re-solved up to 4 times in all three
    stock configs.
participation:
- system: se3-lvio
  takes_part: true
  how: GNC-TLS with 4 and with 8 iterations.
- system: genz-lio
  takes_part: true
  how: GNC-TLS with 4 and with 8 iterations.
- system: lightning-lm
  takes_part: true
  how: GNC-TLS with 4 and with 8 iterations.
