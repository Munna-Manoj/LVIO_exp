id: EXP-013
slug: affine-brightness
title: Does brightness compensation help the camera update?
phase: P5
status: planned
created: '2026-10-07'
system: se3-lvio
depends_on:
- EXP-004
supersedes: null
host: reference
question: Does estimating a per-frame brightness gain and offset (a, b) improve S9b's ATE when the lighting
  changes?
hypothesis: The camera update assumes a patch keeps its brightness between frames. Smoke and changing
  light break that assumption. FAST-LIVO2 estimates the exposure for this reason.
prediction: Better than S9b on missions with lighting changes; ATE changes by less than the noise floor
  elsewhere.
falsified_if: ATE changes by less than the noise floor on every dev mission.
baseline: se3lvio_S9b
variants:
- id: affine_ab
  change: 'SE(3)-LVIO S9b: per-frame brightness gain and offset (a, b) in the camera residual'
  overrides:
    lio.visual.affine_brightness: true
code_change: 'SE(3)-LVIO: new flag `visual.affine_brightness` (default false).'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without brightness compensation (SE(3)-LVIO: `affine_ab` with
  it, `baseline` without it). On each mission, the side with brightness compensation is better if its
  ATE is lower by more than the noise floor, and worse if its ATE is higher by more than the noise floor.
  Brightness compensation helps a system if the side with it is better on at least two of the three dev
  missions, worse on none, and its ms_p95 is less than 10 % higher. Brightness compensation hurts a system
  if the side with it is worse on any mission. Verdict: adopt if brightness compensation helps every system
  that takes part, reject if it hurts every one, and inconclusive otherwise. The summary at the top of
  the page gives the result for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S9b)'
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9b`: two LiDARs (Hesai and Livox), the IMU and the front camera.'
- term: S9a
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9a`: two LiDARs and the IMU, no camera.'
participation:
- system: se3-lvio
  takes_part: true
  how: Brightness compensation is added to its camera update.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO uses no camera.
- system: lightning-lm
  takes_part: false
  how: lightning-lm uses no camera.
