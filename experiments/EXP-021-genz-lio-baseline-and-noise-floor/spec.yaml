id: EXP-021
slug: genz-lio-baseline-and-noise-floor
title: How large is GenZ-LIO's run-to-run noise, and does the harness run it correctly?
phase: P0
status: abandoned
created: '2026-10-12'
system: genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: How much does ATE vary between identical runs of GenZ-LIO stock on the dev missions, and does
  the harness run it without dropping scans or mis-placing the LiDAR?
hypothesis: GenZ-LIO's worker threads (correspondence search and map updates, runtime.max_threads 4) combine
  their results in a fixed order on an offline replay, as SE(3)-LVIO's frontend does (EXP-000), so its
  runs are deterministic or nearly so. With upstream's Hesai template and the GrandTour extrinsic it tracks
  every dev mission at centimetre level.
prediction: σ(ATE) per mission below 0.05 cm. Every run has pose_coverage ≥ 0.99. ATE on ARC-6 below 3
  cm (one scratch smoke run while integrating gave 1.38 cm; it informed this bound and is not a result).
  EIG-2 and SNOW-3 are measured only; no bound is predicted there.
falsified_if: any run has pose_coverage below 0.99, any run fails, or ARC-6 ATE is 3 cm or more. Each
  means the harness or the config is wrong for GenZ-LIO (frame, extrinsic, timestamps, or core budget).
baseline: genz_stock
variants: []
code_change: 'none (the fork adds lvio_exp/ only: runner, config, Containerfile; upstream code unchanged)'
missions:
  set: dev
repeats: 5
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_median_cm
  - ate_max_cm
  - ms_mean
  - ms_p95
  - rss_mb
  - pose_coverage
stress: null
decision_rule: pass (verdict adopt = GenZ-LIO runs correctly in the harness) if all 15 runs are ok with
  pose_coverage ≥ 0.99 and the ARC-6 mean ATE is below 3 cm; otherwise reject and fix the runner or config
  before any experiment uses GenZ-LIO. The σ per mission from this experiment is GenZ-LIO's noise floor
  for all later experiments (ADR-0004, ADR-0012).
