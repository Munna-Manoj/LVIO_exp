id: EXP-006
slug: step-limits-cov-hygiene
title: Do update safeguards change accuracy, or only robustness?
phase: P2
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
supersedes: null
host: reference
question: lightning-lm protects its filter with two safeguards. Do they change ATE on the dev missions?
hypothesis: On healthy data the safeguards never trigger, so ATE does not change. They matter only under
  stress (EXP-018).
prediction: 'All three systems: ATE identical, or changed by less than the noise floor, on every dev mission.'
falsified_if: In any system, the side with the safeguards differs from the side without them by more than
  the noise floor on a dev mission.
baseline: se3lvio_S8
variants:
- id: guards
  change: 'SE(3)-LVIO: both safeguards added'
  overrides:
    lio.update_guards: true
  single_change_reason: the two safeguards are one feature behind one flag
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_guards
  change: 'GenZ-LIO: both safeguards added'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.update_guards: true
  single_change_reason: the two safeguards are one feature behind one flag
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_no_guards
  change: 'lightning-lm: both safeguards switched off'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.update_guards: false
  single_change_reason: the two safeguards are one feature behind one flag
code_change: 'SE(3)-LVIO: new flag `update_guards` (default false). GenZ-LIO: new flag `update_guards`
  in its fork, default false. lightning-lm: new flag `update_guards` in its fork, default true; false
  skips both safeguards in eskf.cc. The SE(3)-LVIO and GenZ-LIO versions are written from lightning-lm''s
  behaviour, not copied. The flag is added to the fork before this experiment is frozen; its default reproduces
  the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without the safeguards (SE(3)-LVIO: `guards` with it, `baseline`
  without it; GenZ-LIO: `genz_guards` with it, `genz` without it; lightning-lm: `lightning` with it, `lightning_no_guards`
  without it). On each mission, the side with the safeguards is better if its ATE is lower by more than
  the noise floor, and worse if its ATE is higher by more than the noise floor. The safeguards helps a
  system if the side with it is better on at least two of the three dev missions, worse on none, and its
  ms_p95 is less than 10 % higher. The safeguards hurts a system if the side with it is worse on any mission.
  For lightning-lm only ARC-6 is judged: the safeguards helps lightning-lm if the side with it is better
  on ARC-6 with less than 10 % more ms_p95, and hurts lightning-lm if it is worse on ARC-6. Verdict: adopt
  if the safeguards helps every system that takes part, reject if it hurts every one, and inconclusive
  otherwise. The summary at the top of the page gives the result for each system. The prediction (no effect)
  holds if every comparison is within the noise floor.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: the two safeguards
  meaning: '(1) A step limit: an update that moves the pose by more than 0.5 m or 5° is rejected, and
    the pose stays at the IMU prediction. (2) Covariance hygiene: after every prediction and update, the
    covariance matrix is made symmetric and its diagonal is kept between 1e-9 and 100.'
participation:
- system: se3-lvio
  takes_part: true
  how: The safeguards are added.
- system: genz-lio
  takes_part: true
  how: The safeguards are added. GenZ-LIO itself only checks that the state stays finite.
- system: lightning-lm
  takes_part: true
  how: lightning-lm already has the safeguards; its variant switches them off.
