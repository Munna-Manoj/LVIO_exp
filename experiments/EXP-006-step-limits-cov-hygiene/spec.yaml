id: EXP-006
slug: step-limits-cov-hygiene
title: Do step limits and covariance hygiene change accuracy or only robustness?
phase: P2
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: Do lightning-lm-style guards (reject an update step > 0.5 m / 5°, symmetrise and floor the covariance)
  change ATE?
hypothesis: These guards never trigger on healthy data, so they should not change accuracy; they matter
  only under stress (P6).
prediction: 'Bit-identical or within noise on every dev mission; fewer divergences under the P6 scan-drop
  profile. GenZ-LIO: the same as SE(3)-LVIO.'
falsified_if: any change beyond noise on clean data (the guard triggers when it should not).
baseline: se3lvio_S8
variants:
- id: guards
  change: step limit 0.5 m / 5° + covariance symmetrise and floor
  overrides:
    lio.update_guards: true
  single_change_reason: the two guards are one safety feature behind one flag
- id: genz
  change: swap baseline config to GenZ-LIO stock (the reference of the GenZ-LIO arms)
  baseline: genz_stock
- id: genz_guards
  change: GenZ-LIO step limit 0.5 m / 5° + covariance symmetrise and floor
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.update_guards: true
  single_change_reason: the two guards are one safety feature behind one flag
code_change: 'new flag update_guards (default false); GenZ-LIO: the same flag as `lvio_exp.update_guards`
  in the fork (default off = upstream), added before freezing'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive. Applied to each system
  separately: SE(3)-LVIO''s arms against `baseline`, GenZ-LIO''s against `genz`, each with its own noise
  floor (EXP-000, EXP-022). The verdict is adopt if the rule adopts for both systems, reject if it rejects
  for both, otherwise inconclusive; the TL;DR gives both (ADR-0012 addendum).'
learn_links: []
