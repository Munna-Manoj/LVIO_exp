verdict: adopt
errata:
- date: '2026-10-12'
  field: prediction
  says: S9c 0.8989
  should_say: S9c 0.8998
  source: the pre-repo run log on the reference host gives S9c ARC-6 ate_rmse_cm 0.8998005 (recomputed
    with lvx.evaluate on 2026-10-08); the digits were swapped when the number was copied, and EXP-000
    measured 0.8998
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`s9a` (S9a)'
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9a`: two LiDARs (Hesai and Livox) and the IMU.'
- term: '`s9b` (S9b)'
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9b`: S9a plus the front camera.'
- term: '`s9c` (S9c)'
  meaning: 'SE(3)-LVIO''s full config `se3lvio_S9c`: S9b plus the online backend (plane bundle adjustment
    and iSAM2).'
- term: '`ll_stock`'
  meaning: 'lightning-lm''s config `lightning_stock`: upstream''s settings, with only the GrandTour sensor
    calibration set.'
- term: '`ll_indoor`'
  meaning: 'lightning-lm''s config `lightning_indoor`: `ll_stock` with 0.2 m grids for indoor scale.'
- term: earlier value
  meaning: The ARC-6 ATE of each config from runs made before this repository existed, recomputed with
    `lvx.evaluate` (each config's `reference_result`).
- term: pose_coverage
  meaning: The share of the scans in the IMU's time span for which the system produced a pose. 1.0 means
    one pose per scan.
- term: deterministic
  meaning: Identical runs give bit-for-bit identical trajectories (σ = 0).
participation:
- system: se3-lvio
  takes_part: true
  how: Its four configs S8, S9a, S9b and S9c.
- system: lightning-lm
  takes_part: true
  how: Its stock and indoor configs.
- system: genz-lio
  takes_part: false
  how: GenZ-LIO was added later; its noise floor comes from EXP-022 (EXP-021 is superseded).
