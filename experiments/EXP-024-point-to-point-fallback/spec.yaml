id: EXP-024
slug: point-to-point-fallback
title: Should points without a plane get a point-to-point residual?
phase: P3
status: planned
created: '2026-10-13'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
- EXP-022
supersedes: null
host: reference
question: GenZ-LIO gives a point that matches no plane a point-to-point residual instead of dropping it.
  Does a point-to-point residual improve ATE, in each system?
hypothesis: In open scenes many points fall where the map has no plane. Those points carry information
  that a point-to-plane update throws away. In confined scenes almost every point has a plane, so the
  extra residual rarely applies.
prediction: 'SE(3)-LVIO with it: ATE changes by less than the noise floor on ARC-6, and is better on EIG-2
  and SNOW-3. GenZ-LIO without it: ATE changes by less than the noise floor on ARC-6, and is worse on
  EIG-2 and SNOW-3. lightning-lm without its point-to-point residual, on ARC-6: ATE changes by less than
  the noise floor.'
falsified_if: In neither SE(3)-LVIO nor GenZ-LIO is the side with point-to-point residuals better on EIG-2
  or SNOW-3.
baseline: se3lvio_S8
variants:
- id: p2p_fallback
  change: 'SE(3)-LVIO: point-to-point residuals for points without a plane, weight factor λ_po 0.05'
  overrides:
    lio.point_to_point_fallback: true
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_no_hybrid
  change: 'GenZ-LIO: point-to-plane residuals only'
  baseline: genz_stock
  reference: genz
  overrides:
    hybrid_metric.enable: false
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_no_icp
  change: 'lightning-lm: point-to-plane residuals only'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    fasterlio.enable_icp_part: false
code_change: 'SE(3)-LVIO: new flag `point_to_point_fallback` (default false), written from the GenZ-LIO
  paper (Sec. V-E, eq. 30); no GPL code is copied. GenZ-LIO and lightning-lm: none (existing keys).'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - inliers_mean
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without point-to-point residuals (SE(3)-LVIO: `p2p_fallback`
  with it, `baseline` without it; GenZ-LIO: `genz` with it, `genz_no_hybrid` without it; lightning-lm:
  `lightning` with it, `lightning_no_icp` without it). On each mission, the side with point-to-point residuals
  is better if its ATE is lower by more than the noise floor, and worse if its ATE is higher by more than
  the noise floor. Point-to-point residuals helps a system if the side with it is better on at least two
  of the three dev missions, worse on none, and its ms_p95 is less than 10 % higher. Point-to-point residuals
  hurts a system if the side with it is worse on any mission. For lightning-lm only ARC-6 is judged: point-to-point
  residuals helps lightning-lm if the side with it is better on ARC-6 with less than 10 % more ms_p95,
  and hurts lightning-lm if it is worse on ARC-6. Verdict: adopt if point-to-point residuals helps every
  system that takes part, reject if it hurts every one, and inconclusive otherwise. The summary at the
  top of the page gives the result for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: point-to-plane residual
  meaning: The distance from a scan point to its matched plane in the map.
- term: point-to-point residual
  meaning: The distance from a scan point to its nearest point in the map. GenZ-LIO uses it only for points
    that match no plane, weighted by λ_po. lightning-lm uses it for every point with at least 3 map neighbours,
    dropping residuals above 0.5 m, with a fixed weight of 100.
participation:
- system: se3-lvio
  takes_part: true
  how: Point-to-point residuals are added for points without a plane.
- system: genz-lio
  takes_part: true
  how: GenZ-LIO has them; its variant switches them off.
- system: lightning-lm
  takes_part: true
  how: lightning-lm has its own version (for every point); its variant switches it off.
