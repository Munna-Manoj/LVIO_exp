id: EXP-009
slug: se3-vs-so3xr3
title: Does the coupled SE(3) retraction matter?
phase: P4
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: Does replacing the SE(3) exponential retraction with the separate SO(3)×R³ retraction (FAST-LIO
  style) change ATE?
hypothesis: For per-scan corrections (mm, mrad) the two retractions differ by about ½ φ×ρ, which is micrometres;
  any effect should appear only in fast turns or with large rotation uncertainty.
prediction: Within noise on every dev mission; if anything, a difference on the fastest-turning segments.
  GenZ-LIO is SO(3)×R³ natively, so its arm goes the other way (SO(3)×R³ → SE(3)); within noise too.
falsified_if: SO(3)×R³ worse beyond noise on most missions (would support the paper's central claim more
  strongly than the theory predicts).
baseline: se3lvio_S8
variants:
- id: so3xr3
  change: retraction SO(3)×R³ instead of SE(3) exp
  overrides:
    lio.retraction: so3xr3
- id: genz
  change: swap baseline config to GenZ-LIO stock (the reference of the GenZ-LIO arms)
  baseline: genz_stock
- id: genz_se3
  change: 'GenZ-LIO: retraction SE(3) exp instead of its SO(3)×R³'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.retraction: se3
code_change: 'new flag retraction {se3,so3xr3} (default se3) in core/lie.cpp boxplus and resetErrorState
  Jacobian; GenZ-LIO: the same flag as `lvio_exp.retraction` in the fork (default off = upstream), added
  before freezing (boxplus and the reset Jacobian of its IKFoM state)'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Per system, against its own reference and noise floor (EXP-000, EXP-022): SE(3) is better
  if, on at least 2/3 of the missions, the SE(3) side beats the SO(3)×R³ side by more than 2σ (SE(3)-LVIO:
  `so3xr3` worse than `baseline`; GenZ-LIO: `genz_se3` better than `genz`) and no mission goes the other
  way beyond 2σ. Verdict adopt (the coupled retraction matters) if SE(3) is better in both systems; reject
  (it does not) if every mission is within 2σ in both systems; otherwise inconclusive. The TL;DR gives
  both systems (ADR-0012 addendum).'
learn_links:
- docs/explain/se3-vs-so3xr3.md
