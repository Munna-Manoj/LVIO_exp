id: EXP-009
slug: se3-vs-so3xr3
title: Does the coupled SE(3) pose update matter?
phase: P4
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
supersedes: null
host: reference
question: Does applying each pose correction as one SE(3) step, instead of a separate rotation and translation
  (SO(3)×R³), change ATE?
hypothesis: For the small corrections of one scan (millimetres, milliradians), the two updates differ
  by about ½ φ × ρ, which is micrometres. Any effect appears only in fast turns or when the rotation is
  very uncertain.
prediction: 'All three systems: ATE changes by less than the noise floor on every dev mission.'
falsified_if: In at least two systems, the SE(3) side is better by more than the noise floor on at least
  two dev missions. That would support the SE(3)-LVIO paper's central claim more strongly than this theory
  predicts.
baseline: se3lvio_S8
variants:
- id: so3xr3
  change: 'SE(3)-LVIO: the separate SO(3)×R³ update'
  overrides:
    lio.retraction: so3xr3
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_se3
  change: 'GenZ-LIO: the coupled SE(3) update'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.retraction: se3
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_se3
  change: 'lightning-lm: the coupled SE(3) update'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.retraction: se3
code_change: 'SE(3)-LVIO: new flag `retraction` {se3, so3xr3} (default se3) in core/lie.cpp boxplus and
  the reset Jacobian. GenZ-LIO: new flag `retraction` in its fork, default so3xr3, in its state''s boxplus.
  lightning-lm: new flag `retraction` in its fork, default so3xr3, in NavState::boxplus. The flag is added
  to the fork before this experiment is frozen; its default reproduces the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without the SE(3) update (SE(3)-LVIO: `baseline` with it,
  `so3xr3` without it; GenZ-LIO: `genz_se3` with it, `genz` without it; lightning-lm: `lightning_se3`
  with it, `lightning` without it). On each mission, the side with the SE(3) update is better if its ATE
  is lower by more than the noise floor, and worse if its ATE is higher by more than the noise floor.
  The SE(3) update helps a system if the side with it is better on at least two of the three dev missions,
  worse on none, and its ms_p95 is less than 10 % higher. The SE(3) update hurts a system if the side
  with it is worse on any mission. For lightning-lm only ARC-6 is judged: the SE(3) update helps lightning-lm
  if the side with it is better on ARC-6 with less than 10 % more ms_p95, and hurts lightning-lm if it
  is worse on ARC-6. Verdict: adopt if the SE(3) update helps every system that takes part, reject if
  it hurts every one, and inconclusive otherwise. The summary at the top of the page gives the result
  for each system. The prediction (no effect) holds if every comparison is within the noise floor.'
learn_links:
- docs/explain/se3-vs-so3xr3.md
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: SE(3) update
  meaning: 'The correction [ρ, φ] is applied as T ← T · Exp([ρ, φ]): the rotation φ also bends the translation
    ρ.'
- term: SO(3)×R³ update
  meaning: 'The rotation and translation are corrected separately: R ← R · Exp(φ) and p ← p + ρ.'
participation:
- system: se3-lvio
  takes_part: true
  how: SE(3)-LVIO uses SE(3); its variant switches to SO(3)×R³.
- system: genz-lio
  takes_part: true
  how: GenZ-LIO uses SO(3)×R³; its variant switches to SE(3).
- system: lightning-lm
  takes_part: true
  how: lightning-lm uses SO(3)×R³; its variant switches to SE(3).
