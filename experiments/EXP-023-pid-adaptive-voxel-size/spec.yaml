id: EXP-023
slug: pid-adaptive-voxel-size
title: Should the point budget grow with the scene's size?
phase: P7
status: planned
created: '2026-10-13'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
- EXP-022
supersedes: null
host: reference
question: GenZ-LIO keeps more points per scan in open scenes than in confined ones. Does that beat a fixed
  budget, in each system?
hypothesis: Confined scenes have many nearby planes, so few points constrain the pose well. Open scenes
  have few, distant planes and need more points. A fixed budget keeps too many points indoors (costing
  time) and too few outdoors (costing accuracy).
prediction: 'Every system, with the scene-scaled budget: ATE changes by less than the noise floor on ARC-6,
  with lower ms_p95, and is better on EIG-2 and SNOW-3. lightning-lm is judged on ARC-6 only, so for lightning-lm
  the prediction is lower ms_p95 with ATE within the noise floor.'
falsified_if: In no system is the side with the scene-scaled budget better on either EIG-2 or SNOW-3.
baseline: se3lvio_S8
variants:
- id: scale_aware
  change: 'SE(3)-LVIO: target rises from 1000 points in confined scenes to 4000 in open ones (stock: a
    fixed 2000)'
  overrides:
    lio.downsample_target: scale_aware
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_fixed_2000
  change: 'GenZ-LIO: a fixed target of 2000 points (stock: 1000 rising to 4000)'
  baseline: genz_stock
  reference: genz
  overrides:
    adaptive_voxelization.min_points: 2000
    adaptive_voxelization.max_points: 2000
  single_change_reason: a fixed target is minimum = maximum; the two keys are one setting
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_scale_aware
  change: 'lightning-lm: a voxel size adjusted so that the target rises from 1000 points to 4000 (stock:
    a fixed 0.2 m voxel)'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.downsample_target: scale_aware
code_change: 'SE(3)-LVIO: new flag `downsample_target` {fixed, scale_aware} (default fixed). scale_aware
  uses GenZ-LIO''s scene-size measure and target law (averaged over 5 scans, saturating at 30 m, exponent
  2, from 1000 to 4000 points) on SE(3)-LVIO''s existing voxel-size controller. It is written from the
  GenZ-LIO paper; no GPL code is copied. GenZ-LIO: none (existing keys). lightning-lm: new flag `downsample_target`
  in its fork, default fixed; scale_aware adds the same target law and a voxel-size controller, because
  lightning-lm has none. The flag is added to the fork before this experiment is frozen; its default reproduces
  the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
  - ms_mean
stress: null
decision_rule: 'Each system is run with and without the scene-scaled budget (SE(3)-LVIO: `scale_aware`
  with it, `baseline` without it; GenZ-LIO: `genz` with it, `genz_fixed_2000` without it; lightning-lm:
  `lightning_scale_aware` with it, `lightning` without it). On each mission, the side with the scene-scaled
  budget is better if its ATE is lower by more than the noise floor, and worse if its ATE is higher by
  more than the noise floor. The scene-scaled budget helps a system if the side with it is better on at
  least two of the three dev missions, worse on none, and its ms_p95 is less than 10 % higher. The scene-scaled
  budget hurts a system if the side with it is worse on any mission. For lightning-lm only ARC-6 is judged:
  the scene-scaled budget helps lightning-lm if the side with it is better on ARC-6 with less than 10
  % more ms_p95, and hurts lightning-lm if it is worse on ARC-6. Verdict: adopt if the scene-scaled budget
  helps every system that takes part, reject if it hurts every one, and inconclusive otherwise. The summary
  at the top of the page gives the result for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: point budget
  meaning: The number of LiDAR points a system keeps from each scan after downsampling.
- term: scene size
  meaning: 'GenZ-LIO''s measure of how open the scene is: the average range of the scan''s points, averaged
    over the last 5 scans.'
- term: scene-scaled budget
  meaning: A target number of points that rises from 1000 at small scene size to 4000 once the scene size
    reaches 30 m. A controller adjusts the voxel size to meet it.
participation:
- system: se3-lvio
  takes_part: true
  how: Its fixed target of 2000 points becomes scene-scaled.
- system: genz-lio
  takes_part: true
  how: GenZ-LIO is scene-scaled already; its variant uses a fixed 2000.
- system: lightning-lm
  takes_part: true
  how: Its fixed voxel becomes a controller with the scene-scaled target.
