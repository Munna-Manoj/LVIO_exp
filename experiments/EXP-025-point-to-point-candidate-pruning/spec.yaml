id: EXP-025
slug: point-to-point-candidate-pruning
title: Does thinning GenZ-LIO's point-to-point candidates cost accuracy?
phase: P3
status: planned
created: '2026-10-13'
system: genz-lio
depends_on:
- EXP-022
supersedes: null
host: reference
question: GenZ-LIO keeps 128 point-to-point candidates per root voxel and divides the budget by 4 per
  subdivision. Does keeping more or fewer change ATE or only time?
hypothesis: The nearest candidate is almost always among the ones kept, so the thinning saves time without
  losing matches. Keeping far fewer starts to miss the nearest match.
prediction: 'No thinning (ratio 1) and 512 candidates: within noise, higher ms_p95. 32 candidates: worse
  on EIG-2 and SNOW-3, where the point-to-point residual carries more of the update.'
falsified_if: no thinning or 512 candidates is better beyond noise on most missions (the stock budget
  loses matches).
baseline: genz_stock
variants:
- id: ratio_1
  change: 'reduction_ratio 1 (stock 4): children keep the parent''s budget'
  overrides:
    hybrid_metric.reduction_ratio: 1
- id: cand_32
  change: max_points_per_voxel 32 (stock 128)
  overrides:
    hybrid_metric.max_points_per_voxel: 32
- id: cand_512
  change: max_points_per_voxel 512 (stock 128)
  overrides:
    hybrid_metric.max_points_per_voxel: 512
code_change: none (existing keys)
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_mean
  - ms_p95
stress: null
decision_rule: adopt if the mean primary metric over the missions improves by more than 2σ run-to-run
  noise on at least 2/3 of the missions, no mission gets worse beyond 2σ, and ms_p95 grows by less than
  10 %; reject if it is worse beyond 2σ on any mission; otherwise inconclusive. An SE(3)-LVIO arm follows
  only if EXP-024 adopts the point-to-point fallback.
learn_links: []
