id: EXP-025
slug: point-to-point-candidate-pruning
title: Does thinning GenZ-LIO's point-to-point candidates cost accuracy?
phase: P3
status: planned
created: '2026-10-13'
system: genz-lio
depends_on:
- EXP-022
supersedes: null
host: reference
question: GenZ-LIO keeps up to 128 candidate points per map voxel for its point-to-point search, and divides
  that number by 4 each time a voxel is split. Does keeping more or fewer candidates change ATE, or only
  scan time?
hypothesis: The nearest candidate is almost always among those kept, so the thinning saves time without
  losing matches. Keeping far fewer starts to miss the nearest match.
prediction: 'No thinning (divide by 1) and 512 candidates: ATE changes by less than the noise floor, and
  ms_p95 is higher. 32 candidates: worse on EIG-2 and SNOW-3, where the point-to-point residual carries
  more of the update.'
falsified_if: No thinning or 512 candidates improves ATE by more than the noise floor on at least two
  dev missions. That would mean the stock setting loses matches.
baseline: genz_stock
variants:
- id: ratio_1
  change: 'GenZ-LIO: no thinning when a voxel is split (divide by 1; stock 4)'
  overrides:
    hybrid_metric.reduction_ratio: 1
- id: cand_32
  change: 'GenZ-LIO: 32 candidates per voxel (stock 128)'
  overrides:
    hybrid_metric.max_points_per_voxel: 32
- id: cand_512
  change: 'GenZ-LIO: 512 candidates per voxel (stock 128)'
  overrides:
    hybrid_metric.max_points_per_voxel: 512
code_change: None (existing keys).
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_mean
  - ms_p95
stress: null
decision_rule: Compare each variant with `baseline` (GenZ-LIO's stock config). Adopt a variant that costs
  less ms_p95 than the stock setting if its ATE is not worse by more than the noise floor on any dev mission.
  Adopt a variant that costs more ms_p95 only if its ATE is better by more than the noise floor on at
  least two dev missions and worse on none. Reject (the stock setting stays) if no variant qualifies and
  at least one is worse by more than the noise floor; otherwise inconclusive.
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (genz_stock)'
  meaning: 'GenZ-LIO''s stock config: upstream''s Hesai settings, with only the sensor calibration and
    the 4-core limit set.'
- term: candidate
  meaning: A map point kept in a voxel so that GenZ-LIO's point-to-point residual can find a scan point's
    nearest map point.
participation:
- system: se3-lvio
  takes_part: false
  how: SE(3)-LVIO has no point-to-point candidates. If EXP-024 adopts point-to-point residuals for SE(3)-LVIO,
    a later experiment adds this question.
- system: genz-lio
  takes_part: true
  how: Its candidate count and its thinning ratio are varied.
- system: lightning-lm
  takes_part: false
  how: lightning-lm finds point-to-point matches through iVox's nearest-point search, not through a candidate
    pool.
