id: EXP-018
slug: stress-suite
title: Which design choices matter when the data gets worse?
phase: P6
status: planned
created: '2026-10-07'
system:
- se3-lvio
- lightning-lm
- genz-lio
depends_on:
- EXP-000
supersedes: null
host: reference
question: Under controlled damage to the data (no Livox, 10 to 30 % of the scans dropped, 4 × fewer points
  per scan, the IMU shifted by ±5 ms), how much does each system's ATE get worse?
hypothesis: SE(3)-LVIO is tuned for clean data and loses more when scans are dropped. lightning-lm's safeguards
  (EXP-006) make it lose less. GenZ-LIO's adaptive point budget makes it lose less when the points are
  thinned.
prediction: Relative to its own clean ATE, lightning-lm loses less than SE(3)-LVIO when scans are dropped,
  and GenZ-LIO loses less than SE(3)-LVIO under 4 × thinning. SE(3)-LVIO stays the most accurate in absolute
  terms. The no-Livox profile does not change S8, GenZ-LIO or lightning-lm, which use the Hesai only.
falsified_if: SE(3)-LVIO loses the least, in relative terms, under every profile.
baseline: se3lvio_S8
variants:
- id: lightning
  change: lightning-lm's indoor config
  baseline: lightning_indoor
- id: genz
  change: GenZ-LIO's stock config
  baseline: genz_stock
code_change: The stress profiles are applied by lvx to the data, not to the systems. The GenZ-LIO and
  lightning-lm runners read the damaged data the same way as SE(3)-LVIO's.
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: suite-v1
decision_rule: Report only. The verdict is inconclusive, with a table of how much each system loses under
  each profile. The table feeds the choice of safeguards in phase P2.
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: stress profile
  meaning: A controlled damage applied to the data before a run (configs/stress.yaml, suite-v1).
participation:
- system: se3-lvio
  takes_part: true
  how: S8 under every profile.
- system: genz-lio
  takes_part: true
  how: Its stock config under every profile.
- system: lightning-lm
  takes_part: true
  how: Its indoor config under every profile.
