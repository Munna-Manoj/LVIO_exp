id: EXP-022
slug: genz-lio-baseline-with-imu-offset
title: How large is GenZ-LIO's run-to-run noise, with the protocol's IMU time offset?
phase: P0
status: concluded
created: '2026-10-12'
system: genz-lio
depends_on:
- EXP-000
supersedes: EXP-021
host: reference
question: How much does ATE vary between identical runs of GenZ-LIO stock on the dev missions, and does
  the harness run it without dropping scans or mis-placing the LiDAR?
hypothesis: GenZ-LIO's worker threads (correspondence search and map updates, runtime.max_threads 4) combine
  their results in a fixed order on an offline replay, as SE(3)-LVIO's frontend does (EXP-000), so its
  runs are deterministic or nearly so. With upstream's Hesai template and the GrandTour extrinsic it tracks
  every dev mission at centimetre level.
prediction: σ(ATE) per mission below 0.05 cm. Every run has pose_coverage ≥ 0.99. ATE on ARC-6 below 3
  cm. EXP-021 ran the same config without the IMU offset and got 1.382 (arc-6), 2.506 (eig-2) and 5.884
  cm (snow-3); with the offset we expect each within ±20 % of those, since the offset is 5-6.5 ms and
  the IMU prior is only one input to each scan's update.
falsified_if: any run has pose_coverage below 0.99, any run fails, or ARC-6 ATE is 3 cm or more. Each
  means the harness or the config is wrong for GenZ-LIO (frame, extrinsic, timestamps, or core budget).
baseline: genz_stock
variants: []
code_change: none to upstream code; the fork's runner now applies the per-mission IMU time offset (--imu-dt,
  configs/missions.yaml), which EXP-021 left out (pin 0936d34)
missions:
  set: dev
repeats: 5
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_median_cm
  - ate_max_cm
  - ms_mean
  - ms_p95
  - rss_mb
  - pose_coverage
stress: null
decision_rule: pass (verdict adopt = GenZ-LIO runs correctly in the harness, under the full protocol)
  if all 15 runs are ok with pose_coverage ≥ 0.99 and the ARC-6 mean ATE is below 3 cm; otherwise reject
  and fix the runner or config before any experiment uses GenZ-LIO. The σ per mission from this experiment
  is GenZ-LIO's noise floor for all later experiments (ADR-0004, ADR-0012).
learn_links: []
history:
- date: '2026-10-12'
  status: approved
- date: '2026-10-12'
  status: running
- date: '2026-10-12'
  status: analysed
- date: '2026-10-12'
  status: concluded
  verdict: adopt
verdict: adopt
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (genz_stock)'
  meaning: 'GenZ-LIO''s stock config: upstream''s Hesai settings, with only the sensor calibration and
    the 4-core limit set.'
- term: IMU time offset
  meaning: The delay between the IMU clock and the LiDAR clock, fitted once per mission (configs/missions.yaml
    `imu_dt`). The protocol applies it to every system.
- term: pose_coverage
  meaning: The share of the scans in the IMU's time span for which the system produced a pose. 1.0 means
    one pose per scan.
- term: deterministic
  meaning: Identical runs give bit-for-bit identical trajectories (σ = 0).
participation:
- system: genz-lio
  takes_part: true
  how: Its stock config, 5 repeats per mission.
- system: se3-lvio
  takes_part: false
  how: Its noise floor comes from EXP-000; its numbers are quoted for comparison.
- system: lightning-lm
  takes_part: false
  how: Its noise floor comes from EXP-000; its numbers are quoted for comparison.
