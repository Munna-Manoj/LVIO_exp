id: EXP-007
slug: smoke-filter
title: Does dropping weak, close returns remove smoke without hurting accuracy?
phase: P3
status: planned
created: '2026-10-07'
system:
- se3-lvio
- genz-lio
- lightning-lm
depends_on:
- EXP-000
supersedes: null
host: reference
question: Does dropping LiDAR points with low intensity close to the robot improve ATE?
hypothesis: On ARC-6, the points that hit smoke have low intensity (median 2, against 11 for other points)
  and short range (median 1.5 m), and they last only a few scans. They enter the map as fake planes. Dropping
  them removes the fake planes.
prediction: 'All three systems: better on ARC-6, mainly near the start where the smoke is; ATE changes
  by less than the noise floor on EIG-2 and SNOW-3.'
falsified_if: The filter is not better on ARC-6 in any system.
baseline: se3lvio_S8
variants:
- id: smoke_i3_r3
  change: 'SE(3)-LVIO: drop points with intensity < 3 within 3 m'
  overrides:
    lio.smoke_filter: 3,3.0
- id: genz
  change: GenZ-LIO's stock config. The GenZ-LIO variants are compared with this one.
  baseline: genz_stock
- id: genz_smoke_i3_r3
  change: 'GenZ-LIO: drop points with intensity < 3 within 3 m'
  baseline: genz_stock
  reference: genz
  overrides:
    lvio_exp.smoke_filter: 3,3.0
- id: lightning
  change: lightning-lm's indoor config. The lightning-lm variants are compared with this one.
  baseline: lightning_indoor
- id: lightning_smoke_i3_r3
  change: 'lightning-lm: drop points with intensity < 3 within 3 m'
  baseline: lightning_indoor
  reference: lightning
  overrides:
    lvio_exp.smoke_filter: 3,3.0
code_change: 'All three systems: new flag `smoke_filter` "<min intensity>,<max range>" (default empty
  = off), applied to the raw Hesai points before downsampling. The flag is added to the fork before this
  experiment is frozen; its default reproduces the stock behaviour.'
missions:
  set: dev
repeats: 3
metrics:
  primary: ate_rmse_cm
  secondary:
  - ate_max_cm
  - ms_p95
stress: null
decision_rule: 'Each system is run with and without the smoke filter (SE(3)-LVIO: `smoke_i3_r3` with it,
  `baseline` without it; GenZ-LIO: `genz_smoke_i3_r3` with it, `genz` without it; lightning-lm: `lightning_smoke_i3_r3`
  with it, `lightning` without it). On each mission, the side with the smoke filter is better if its ATE
  is lower by more than the noise floor, and worse if its ATE is higher by more than the noise floor.
  The smoke filter helps a system if the side with it is better on at least two of the three dev missions,
  worse on none, and its ms_p95 is less than 10 % higher. The smoke filter hurts a system if the side
  with it is worse on any mission. For lightning-lm only ARC-6 is judged: the smoke filter helps lightning-lm
  if the side with it is better on ARC-6 with less than 10 % more ms_p95, and hurts lightning-lm if it
  is worse on ARC-6. Verdict: adopt if the smoke filter helps every system that takes part, reject if
  it hurts every one, and inconclusive otherwise. The summary at the top of the page gives the result
  for each system.'
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: lightning-lm on the field missions
  meaning: 'Both lightning-lm configs lose track on EIG-2 and SNOW-3 in EXP-000 (`lightning`: 294 cm and
    41 cm). A lightning-lm variant is therefore judged on ARC-6 only. Its EIG-2 and SNOW-3 numbers are
    still reported.'
- term: intensity
  meaning: The strength of a LiDAR return as reported by the Hesai XT32, from 0 to 255.
participation:
- system: se3-lvio
  takes_part: true
  how: The same filter, on the same Hesai points.
- system: genz-lio
  takes_part: true
  how: The same filter, on the same Hesai points.
- system: lightning-lm
  takes_part: true
  how: The same filter, on the same Hesai points.
