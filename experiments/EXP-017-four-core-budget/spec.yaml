id: EXP-017
slug: four-core-budget
title: Do all three systems hold 10 Hz and 20 Hz on four cores?
phase: P7
status: planned
created: '2026-10-07'
system:
- se3-lvio
- lightning-lm
- genz-lio
depends_on:
- EXP-016
supersedes: null
host: reference
question: With 4 pinned cores, what are the scan times (ms_p95 and maximum) of SE(3)-LVIO (S8 and S9b),
  lightning-lm and GenZ-LIO?
hypothesis: All three fit 10 Hz (100 ms per scan) on 4 server cores. lightning-lm has the most headroom
  for 20 Hz (50 ms per scan). Raspberry Pi 5 cores are about 2 to 3 times slower, so the margin on the
  server must be large.
prediction: S8 ms_p95 below 50 ms; S9b above 50 ms; lightning-lm below 30 ms on ARC-6; GenZ-LIO below
  100 ms on every dev mission but above 50 ms on EIG-2 and SNOW-3 (EXP-022 measured 38, 66 and 61 ms).
falsified_if: 'S8''s ms_p95 is above 100 ms on 4 cores: SE(3)-LVIO would not run in real time even on
  server cores.'
baseline: se3lvio_S8
variants:
- id: s9b
  change: SE(3)-LVIO's config S9b (two LiDARs, IMU and camera)
  baseline: se3lvio_S9b
- id: lightning
  change: lightning-lm's indoor config
  baseline: lightning_indoor
- id: genz
  change: GenZ-LIO's stock config
  baseline: genz_stock
code_change: None.
missions:
  set: dev
repeats: 3
metrics:
  primary: ms_p95
  secondary:
  - ms_mean
  - ms_max
  - rss_mb
  - ate_rmse_cm
stress: null
decision_rule: Report only. The verdict is inconclusive, unless a system's ms_p95 is above 100 ms on a
  dev mission; that system is then rejected for 10 Hz on this host.
learn_links: []
terms:
- term: ATE
  meaning: 'Absolute trajectory error: the root-mean-square distance between the estimated trajectory
    and the ground-truth trajectory, in centimetres, after the two are aligned. Lower is better.'
- term: scan time (ms_p95)
  meaning: 'The time a system needs to process one LiDAR scan, in milliseconds. `ms_p95` is the 95th percentile
    over a mission: 95 % of the scans take less than this.'
- term: noise floor
  meaning: 'The smallest ATE difference that counts as a real effect: 2 × σ, where σ is the standard deviation
    of ATE between identical runs of that system''s stock config (EXP-000 for SE(3)-LVIO and lightning-lm,
    EXP-022 for GenZ-LIO). It is never less than 0.01 cm.'
- term: variant
  meaning: One configuration that is run. Each variant differs from the variant it is compared with in
    exactly one change.
- term: dev missions
  meaning: 'The three missions used to decide experiments: ARC-6 (indoor, with smoke), EIG-2 (a glacier
    climb, outdoor) and SNOW-3 (a snow field, outdoor). The test missions are kept for final reports.'
- term: '`baseline` (S8)'
  meaning: 'SE(3)-LVIO''s stock config `se3lvio_S8`: one LiDAR (the Hesai XT32) and the IMU, no camera,
    no backend.'
- term: '`genz`'
  meaning: 'GenZ-LIO''s stock config `genz_stock`: upstream''s Hesai settings, with only the sensor calibration
    and the 4-core limit set.'
- term: '`lightning`'
  meaning: 'lightning-lm''s config `lightning_indoor`: upstream''s settings with 0.2 m grids. It is the
    better of lightning-lm''s two configs on ARC-6 in EXP-000 (1.41 cm against 1.64 cm).'
- term: S9b
  meaning: 'SE(3)-LVIO''s config `se3lvio_S9b`: two LiDARs (Hesai and Livox), the IMU and the front camera.'
- term: 4 pinned cores
  meaning: Each run is limited to the same 4 CPU cores (cores 0 to 3 of the reference host) with taskset.
participation:
- system: se3-lvio
  takes_part: true
  how: S8 and S9b.
- system: genz-lio
  takes_part: true
  how: Its stock config.
- system: lightning-lm
  takes_part: true
  how: Its indoor config.
