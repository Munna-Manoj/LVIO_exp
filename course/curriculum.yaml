# The ONE curriculum. docs/learn/README.md tables are generated from this file (python tools/sync_course.py).
#
# Order follows the book "SLAM in Autonomous Driving" (SAD, Gao Xiang et al.; code MIT, book text NOT copied,
# only linked). Parts A-F track book chapters 2-10 (plus B05 robust estimation), part G goes beyond the book
# (camera, LVIO, evaluation),
# and part X is the capstone: lightning-lm (the same author's production LIO), SE(3)-LVIO, and the ablation study.
#
# Per chapter:
#   builds       the Python files of the chapter folder (self-contained: copied, never imported, CLAUDE.md law 0)
#   scene        the synthetic example: something a person recognises at a glance, and its "money plot".
#                "The Courtyard" is a shared world (box room 20x12x4 m + 25 m corridor + 3 pillars + ramp,
#                trajectory = figure-eight then into the corridor and back) that each chapter regenerates
#                with its own copy of a ~40-line generator, so learners meet the same place again and again.
#   sad          book chapter + the official C++ apps the "Run it in C++" lab uses
#   labs         lab ids defined in `labs:` below (run with `lvx lab run <id>`, recorded with a manifest)
#   experiments  ablations in experiments/ that test the chapter's idea on GrandTour
#   datasets     real datasets the chapter's "On real data" step reads (configs/datasets.yaml), in Python
#   kind: bridge I-chapters: content the SAD book does not cover, placed where the course needs it. They have
#                no book companion and a required "On real data" step on SAD datasets and/or GrandTour.
#   status       planned | drafted | done   (done = README + code + results + test; set by hand, checked by CI)
#   template     2 (default): README in lessons, each climbing the ladder of CLAUDE.md §11. 1: the older fixed
#                sections (Intuition, The math, See it, Break it); only chapters written before the ladder, to port

parts:
  A: {title: "Mathematical foundations", sad_chapters: [2]}
  B: {title: "Inertial and integrated navigation", sad_chapters: [3, 4]}
  C: {title: "Point clouds, nearest neighbours and 2D LiDAR SLAM", sad_chapters: [5, 6]}
  D: {title: "3D LiDAR odometry and loosely coupled LIO", sad_chapters: [7]}
  E: {title: "Tightly coupled LIO", sad_chapters: [8]}
  F: {title: "Mapping, loop closure and localisation", sad_chapters: [9, 10]}
  G: {title: "Beyond the book: camera, LVIO, evaluation", sad_chapters: []}
  X: {title: "Capstone: real systems and the ablation study", sad_chapters: []}

chapters:
  - {id: A01, slug: rotations-and-poses, title: "Rotations and poses: SO(3), SE(3), Exp/Log, boxplus, Jacobians",
     scene: "three lessons: a box turned on its own axes or the world's; a nudged rotation vector; a blindfolded robot whose end points form the pose 'banana'",
     part: A, sad: {chapter: 2, apps: [motion]},
     builds: [so3.py, se3.py, lesson1_sides.py, lesson2_jacobian.py, lesson3_walk.py, lesson3_banana.py, main.py,
              live_box.py, live_walk.py, live_dots.py], depends_on: [], labs: [],
     experiments: [EXP-009], status: done}
  - {id: A02, slug: kalman-filters, title: "From the Kalman filter to the error-state Kalman filter",
     scene: "a cart on a rail, then a unicycle: ±3σ band, shrinking ellipses",
     part: A, sad: {chapter: 2}, builds: [kf.py], depends_on: [A01], labs: [],
     experiments: [], status: planned}

  - {id: B01, slug: imu-propagation, title: "IMU propagation: why IMU-only odometry drifts, and how fast",
     scene: "a 3D figure-eight: IMU-only runs fanning out",
     part: B, sad: {chapter: 3, apps: [run_imu_integration]}, builds: [simulate.py, propagate.py, main.py], depends_on: [A01],
     labs: [sad-ch3-imu-integration], experiments: [EXP-010, EXP-011], status: done,
     template: 1}
  - {id: I01, kind: bridge, slug: real-imus-and-allan-variance, title: "Real IMUs: noise densities, bias instability and Allan variance (vehicle IMU vs STIM320)",
     scene: "a still IMU for hours: Allan-deviation slopes −½, 0, +½",
     part: B, builds: [allan.py], depends_on: [B01], labs: [], datasets: [sad-ulhk, grandtour],
     experiments: [EXP-010], status: planned}
  - {id: B02, slug: eskf-gins, title: "ESKF with GNSS: the first fusion filter",
     scene: "a car on a stadium track, 1 Hz GNSS, a 30 s outage: error sawtooth",
     part: B, sad: {chapter: 3, apps: [run_eskf_gins]}, builds: [eskf.py], depends_on: [A02, B01],
     labs: [sad-ch3-eskf-gins, sad-ch3-eskf-gins-odom], experiments: [EXP-010], status: planned}
  - {id: I02, kind: bridge, slug: time-offsets-and-extrinsics, title: "Time offsets, lever arms and extrinsics: estimate them, or pay in centimetres",
     scene: "the stadium track with a 50 ms time offset and a 1 m lever arm",
     part: B, builds: [calib.py], depends_on: [B02, I01], labs: [], datasets: [sad-builtin, grandtour],
     experiments: [EXP-011, EXP-018], status: planned}
  - {id: B03, slug: preintegration, title: "IMU preintegration: one factor for a hundred samples",
     scene: "two keyframes, 200 IMU samples → one relative-motion arrow",
     part: B, sad: {chapter: 4, apps: [test_preintegration]}, builds: [preint.py], depends_on: [B01],
     labs: [sad-ch4-preintegration-test], experiments: [], status: planned}
  - {id: B04, slug: factor-graphs-gins, title: "Factor graphs: GINS as an optimisation problem",
     scene: "a square of 5 poses + 1 loop (Pose2SLAM), then M3500",
     part: B, sad: {chapter: 4, apps: [run_gins_pre_integ]}, builds: [nls.py, graph.py], depends_on: [B02, B03],
     labs: [sad-ch4-gins-preinteg], experiments: [EXP-014], status: planned}

  - {id: B05, slug: robust-estimation, title: "Robust estimation: gates, M-estimators (IRLS), RANSAC and GNC",
     scene: "a line with 50 % outliers: loss and weight curves, RANSAC, GNC",
     part: B, builds: [robust.py], depends_on: [B04], labs: [], experiments: [EXP-001, EXP-002, EXP-003, EXP-015],
     status: planned}

  - {id: C01, slug: point-clouds-and-deskew, title: "Point clouds: scan patterns, motion distortion, deskewing, downsampling",
     scene: "a spinning 16-line LiDAR in a box room: bent wall, then deskewed",
     part: C, sad: {chapter: 5, apps: [scan_to_range_image, pcd_to_bird_eye]}, builds: [lidar_sim.py, deskew.py],
     depends_on: [B01], labs: [], experiments: [EXP-016], status: planned}
  - {id: C02, slug: nearest-neighbour-structures, title: "Nearest-neighbour structures and speed: grid, kd-tree, octree, ikd-tree, iVox, VoxelMap",
     scene: "10⁴–10⁶ room points: query time vs N; kd-tree cells in 2D",
     part: C, sad: {chapter: 5, apps: [test_nn]}, builds: [maps/], depends_on: [C01],
     labs: [sad-ch5-nn-benchmark], experiments: [EXP-008, EXP-020], status: planned}
  - {id: C03, slug: line-and-plane-fitting, title: "Line and plane fitting, and the uncertainty of a plane",
     scene: "a noisy plane patch: eigenvalue bars, normal-uncertainty cone",
     part: C, sad: {chapter: 5, apps: [linear_fitting]}, builds: [fitting.py], depends_on: [C02],
     labs: [sad-ch5-linear-fitting], experiments: [EXP-001], status: planned}
  - {id: C04, slug: 2d-scan-matching, title: "2D scan matching: ICP and likelihood fields",
     scene: "an L-shaped 2D room: ICP iterations, likelihood-field heatmap",
     part: C, sad: {chapter: 6, apps: [test_2d_icp_s2s, test_2d_icp_likelihood]}, builds: [scan2d.py],
     depends_on: [C02, B04], labs: [sad-ch6-icp-s2s, sad-ch6-icp-likelihood], experiments: [], status: planned}
  - {id: C05, slug: 2d-mapping-and-loops, title: "2D mapping: occupancy grids, submaps and loop closure",
     scene: "a ray-cast corridor loop: occupancy grid before/after loop closure",
     part: C, sad: {chapter: 6, apps: [test_2d_mapping, test_mr_matching]}, builds: [grid2d.py],
     depends_on: [C04], labs: [sad-ch6-2d-mapping], experiments: [], status: planned}

  - {id: D01, slug: icp-variants, title: "3D registration: point-to-point, point-to-line, point-to-plane ICP",
     scene: "Stanford bunny: error vs iteration, basin of convergence",
     part: D, sad: {chapter: 7, apps: [test_icp]}, builds: [register.py], depends_on: [C02, C03, B04],
     labs: [sad-ch7-icp], experiments: [EXP-001], status: planned}
  - {id: D02, slug: ndt, title: "NDT: registration against a map of Gaussians",
     scene: "the voxelised room: per-voxel Gaussians, NDT score surface",
     part: D, sad: {chapter: 7, apps: [test_icp]}, builds: [ndt.py], depends_on: [D01],
     labs: [sad-ch7-icp], experiments: [EXP-020], status: planned}
  - {id: D03, slug: lidar-odometry, title: "LiDAR-only odometry: NDT LO, incremental NDT, LOAM-like features, and degeneracy",
     scene: "the Courtyard corridor: Hessian eigenvalue dip, drift along the corridor",
     part: D, sad: {chapter: 7, apps: [test_ndt_lo, test_inc_ndt_lo, test_loam_odom]}, builds: [lo.py],
     depends_on: [D01, D02, C01], labs: [sad-ch7-ndt-lo, sad-ch7-inc-ndt-lo, sad-ch7-loam-like],
     experiments: [EXP-005], status: planned}
  - {id: I03, kind: bridge, slug: degeneracy, title: "Degeneracy: when the geometry cannot constrain the pose (corridors, open fields)",
     scene: "corridor + open field: constraint ellipsoids drawn on the map",
     part: D, builds: [degeneracy.py], depends_on: [D03], labs: [], datasets: [sad-ulhk, grandtour],
     experiments: [EXP-005, EXP-006], status: planned}
  - {id: D04, slug: loosely-coupled-lio, title: "Loosely coupled LIO: an ESKF that takes LO poses",
     scene: "the Courtyard: position covariance with vs without LiDAR",
     part: D, sad: {chapter: 7, apps: [test_loosely_lio]}, builds: [lio_loose.py], depends_on: [D03, B02],
     labs: [sad-ch7-loosely-lio], experiments: [], status: planned}

  - {id: E01, slug: iekf-is-gauss-newton, title: "The iterated EKF is Gauss-Newton with a prior",
     scene: "one range measurement: EKF vs IEKF iterates walking to the optimum",
     part: E, sad: {chapter: 8}, builds: [iekf.py], depends_on: [A02, B04], labs: [],
     experiments: [EXP-009], status: done}
  - {id: E02, slug: tightly-coupled-lio, title: "Tightly coupled LIO with an IEKF (a mini FAST-LIO)",
     scene: "the Courtyard: map coloured by point-to-plane residual",
     part: E, sad: {chapter: 8, apps: [test_lio_iekf]}, builds: [lio_iekf.py], depends_on: [E01, D01, C01, B05],
     labs: [sad-ch8-lio-iekf], experiments: [EXP-001, EXP-006, EXP-010], status: planned}
  - {id: I04, kind: bridge, slug: map-structures-in-the-loop, title: "Map structures in the loop: kd-tree vs ikd-tree vs iVox vs VoxelMap inside your LIO",
     scene: "the Courtyard: memory and query time vs map size, per structure",
     part: E, builds: [maps/ivox.py, maps/voxelmap.py], depends_on: [E02, C02], labs: [], datasets: [sad-nclt, grandtour],
     experiments: [EXP-008, EXP-016, EXP-020], status: planned}
  - {id: I05, kind: bridge, slug: multi-lidar-fusion, title: "Multi-LiDAR fusion: two scanners, two noise models, one map",
     scene: "two LiDARs: a 'doubled' wall before/after extrinsic calibration",
     part: E, builds: [multilidar.py], depends_on: [E02, I02], labs: [], datasets: [grandtour],
     experiments: [EXP-000, EXP-018], status: planned}
  - {id: E03, slug: preintegration-lio, title: "Preintegration-based LIO: the optimisation alternative",
     scene: "the Courtyard, sliding window: biases converging",
     part: E, sad: {chapter: 8, apps: [test_lio_preinteg]}, builds: [lio_graph.py], depends_on: [E02, B04],
     labs: [sad-ch8-lio-preinteg], experiments: [], status: planned}

  - {id: F01, slug: offline-mapping, title: "Offline mapping: frontend, backend, map optimisation",
     scene: "three laps of the Courtyard: blurred vs crisp walls",
     part: F, sad: {chapter: 9, apps: [run_frontend, run_optimization]}, builds: [mapping.py],
     depends_on: [E02, B04], labs: [sad-ch9-frontend, sad-ch9-optimization], experiments: [EXP-014], status: planned}
  - {id: F02, slug: loop-closure, title: "Loop closure: candidates, verification, and a robust pose graph",
     scene: "M3500 / sphere with fake loops: L2 collapses, a robust kernel survives",
     part: F, sad: {chapter: 9, apps: [run_loopclosure, run_mapping]}, builds: [loop.py], depends_on: [F01, B05],
     labs: [sad-ch9-loopclosure], experiments: [EXP-014, EXP-015], status: planned}
  - {id: I06, kind: bridge, slug: online-smoothing-backend, title: "An online smoothing backend: keyframe windows, plane bundle adjustment, iSAM2-style updates",
     scene: "room planes seen from many poses: plane thickness before/after BA",
     part: F, builds: [backend.py], depends_on: [F02, B04], labs: [], datasets: [sad-nclt, grandtour],
     experiments: [EXP-014], status: planned}
  - {id: I07, kind: bridge, slug: dynamic-objects-and-map-hygiene, title: "Dynamic objects and map hygiene: people, cars, smoke, and free-space carving",
     scene: "a box 'car' crossing the room: ghost trail, removed by ray carving",
     part: F, builds: [hygiene.py], depends_on: [F01, B05], labs: [], datasets: [sad-ulhk, grandtour],
     experiments: [EXP-007, EXP-008], status: planned}
  - {id: F03, slug: map-localisation, title: "Localisation in a prior map: tiles, initial search, EKF fusion",
     scene: "kidnapped in the Courtyard map: score heatmap over (x, y)",
     part: F, sad: {chapter: 10, apps: [split_map, run_fusion_offline]}, builds: [localise.py],
     depends_on: [F01, D02], labs: [sad-ch10-fusion], experiments: [], status: planned}

  - {id: G01, slug: photometric-alignment, title: "Direct photometric alignment: patches, pyramids, exposure",
     scene: "a textured wall: photometric cost vs shift, coarse-to-fine basin",
     part: G, builds: [photometric.py], depends_on: [A01], labs: [], experiments: [EXP-004, EXP-012, EXP-013],
     status: planned}
  - {id: G02, slug: lvio, title: "LVIO: adding the camera to a LiDAR-inertial filter",
     scene: "the Courtyard with textured walls: LIO drifts in the corridor, LVIO does not",
     part: G, builds: [lvio.py], depends_on: [E02, G01], labs: [], datasets: [grandtour], experiments: [EXP-004, EXP-012], status: planned}
  - {id: G03, slug: evaluation, title: "Evaluation done right: frames, lever arms, alignment, ATE/RTE, noise floors",
     scene: "one trajectory, three alignments: how frames change ATE",
     part: G, builds: [metrics.py], depends_on: [A01], labs: [], datasets: [sad-nclt, grandtour], experiments: [EXP-000], status: planned}

  - {id: X01, slug: anatomy-of-lightning-lm, title: "Anatomy of lightning-lm: the book's ideas in a production LIO",
     part: X, builds: [], depends_on: [E02, F02], labs: [], experiments: [EXP-019], status: planned}
  - {id: X02, slug: anatomy-of-se3-lvio, title: "Anatomy of SE(3)-LVIO: SE(3) IEKF, VoxelMap, photometric update, plane BA",
     part: X, builds: [], depends_on: [E02, G02], labs: [], experiments: [EXP-000, EXP-009, EXP-020], status: planned}
  - {id: X03, slug: running-the-ablation-study, title: "Running the ablation study: from spec to verdict",
     part: X, builds: [], depends_on: [G03, X01, X02], labs: [], experiments: [EXP-000, EXP-001], status: planned}
  - {id: X04, slug: your-own-experiment, title: "Design your own experiment",
     part: X, builds: [], depends_on: [X03], labs: [], experiments: [], status: planned}

# C++ labs on the official SAD code (system `sad` in systems/systems.yaml). `lvx lab run <id>` runs one in a
# scratch copy of the SAD tree (the apps write into ./data/), records a manifest, the log tail and wall time
# under course/chapters/<chapter>/results/labs/<id>/. `status: verified` once a run has been recorded.
labs:
  sad-ch3-imu-integration: {chapter: B01, app: run_imu_integration, args: "--with_ui=false", dataset: sad-builtin, status: verified}
  sad-ch3-eskf-gins:       {chapter: B02, app: run_eskf_gins, args: "--with_ui=false", dataset: sad-builtin, status: planned,
                            note: "headless run verified by hand on the reference host 2026-10-07 (6.6 min wall); not yet via lvx"}
  sad-ch3-eskf-gins-odom:  {chapter: B02, app: run_eskf_gins, args: "--with_ui=false --with_odom=true", dataset: sad-builtin, status: planned}
  sad-ch4-preintegration-test: {chapter: B03, app: test_preintegration, args: "--with_ui=false", dataset: sad-builtin, status: planned}
  sad-ch4-gins-preinteg:   {chapter: B04, app: run_gins_pre_integ, args: "--with_ui=false", dataset: sad-builtin, status: planned}
  sad-ch5-nn-benchmark:    {chapter: C02, app: test_nn, args: "", dataset: sad-builtin, status: planned}
  sad-ch5-linear-fitting:  {chapter: C03, app: linear_fitting, args: "", dataset: sad-builtin, status: planned}
  sad-ch6-icp-s2s:         {chapter: C04, app: test_2d_icp_s2s, args: "--bag_path {data}/floor1.bag", dataset: sad-2dmapping, status: planned}
  sad-ch6-icp-likelihood:  {chapter: C04, app: test_2d_icp_likelihood, args: "--bag_path {data}/floor1.bag", dataset: sad-2dmapping, status: planned}
  sad-ch6-2d-mapping:      {chapter: C05, app: test_2d_mapping, args: "--bag_path {data}/floor1.bag", dataset: sad-2dmapping, status: planned}
  sad-ch7-icp:             {chapter: D01, app: test_icp, args: "", dataset: sad-builtin, status: planned}
  sad-ch7-ndt-lo:          {chapter: D03, app: test_ndt_lo, args: "--bag_path {data}/test2.bag --display_map=false", dataset: sad-ulhk, status: planned}
  sad-ch7-inc-ndt-lo:      {chapter: D03, app: test_inc_ndt_lo, args: "--bag_path {data}/test2.bag --display_map=false", dataset: sad-ulhk, status: planned}
  sad-ch7-loam-like:       {chapter: D03, app: test_loam_odom, args: "--bag_path {data}/test1.bag --display_map=false", dataset: sad-wxb, status: planned}
  sad-ch7-loosely-lio:     {chapter: D04, app: test_loosely_lio, args: "--bag_path {data}/test3.bag --display_map=false", dataset: sad-ulhk, status: planned}
  sad-ch8-lio-iekf:        {chapter: E02, app: test_lio_iekf, args: "--bag_path {data}/20120115.bag --display_map=false", dataset: sad-nclt, status: planned}
  sad-ch8-lio-preinteg:    {chapter: E03, app: test_lio_preinteg, args: "--bag_path {data}/20120115.bag --display_map=false", dataset: sad-nclt, status: planned}
  sad-ch9-frontend:        {chapter: F01, app: run_frontend, args: "", dataset: sad-nclt, status: planned}
  sad-ch9-optimization:    {chapter: F01, app: run_optimization, args: "", dataset: sad-nclt, status: planned}
  sad-ch9-loopclosure:     {chapter: F02, app: run_loopclosure, args: "", dataset: sad-nclt, status: planned}
  sad-ch10-fusion:         {chapter: F03, app: run_fusion_offline, args: "", dataset: sad-nclt, status: planned}
