# The ONLY mission registry. Splits are fixed by ADR-0005; moving a mission between splits needs a new ADR.
# imu_dt: per-mission IMU time offset (s), from se3-livom-comfort src/se3-lio/config/imu_dt.yaml.
# gt: whether prism ground truth is public (COMFORT Validation missions). Test-set missions have no GT and are
#     used only for qualitative maps and runtime.
# split: dev (tune here) | test (report here) | nogt (no ground truth) | tbd (to be fixed in M0, see ROADMAP)
missions:
  arc-2:  {imu_dt: -0.0073, gt: tbd, split: tbd}
  arc-3:  {imu_dt: -0.0056, gt: tbd, split: tbd}
  arc-6:  {imu_dt: -0.0065, gt: true, split: dev, date: 2024-11-18-17-13-09, note: "first mission, smoke near the start"}
  arc-7:  {imu_dt: -0.0047, gt: tbd, split: tbd}
  con-3:  {imu_dt: -0.0060, gt: tbd, split: tbd}
  con-4:  {imu_dt: -0.0064, gt: tbd, split: tbd}
  eig-1:  {imu_dt: -0.0057, gt: tbd, split: tbd}
  eig-2:  {imu_dt: -0.0054, gt: tbd, split: tbd}
  snow-2: {imu_dt: -0.0055, gt: tbd, split: tbd}
  snow-3: {imu_dt: -0.0048, gt: tbd, split: tbd}
  spx-1:  {imu_dt: -0.0044, gt: tbd, split: tbd}
  spx-2:  {imu_dt: -0.0074, gt: tbd, split: tbd}

# Named sets used by experiment specs (missions: {set: dev}).
sets:
  smoke: [arc-6]          # single-mission sanity set, allowed only for EXP-000 and debugging
  dev: [arc-6]            # grows to 3 GT missions in M0
  test: []                # 3 GT missions, filled in M0, never used for tuning
