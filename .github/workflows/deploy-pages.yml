name: Deploy docs site + 3D viewer to Pages

# MkDocs site at "/", the three.js viewer (web/) at "/viewer/" once it exists (M2.2).
on:
  push:
    branches: [main]
    paths: ["docs/**", "course/**", "mkdocs.yml", "web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[docs]" && python tools/sync_course.py && mkdocs build --strict
      - name: Build viewer (if present)
        run: |
          if [ -f web/package.json ]; then cd web && npm ci && npm run build && mkdir -p ../site/viewer && cp -r dist/. ../site/viewer/; fi
          touch ../site/.nojekyll 2>/dev/null || touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
