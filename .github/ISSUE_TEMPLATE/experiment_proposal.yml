name: Experiment proposal
description: Propose a question for the ablation study (becomes a spec after discussion)
labels: [experiment]
body:
  - type: input
    id: question
    attributes: {label: Question, description: "One question, answerable by ATE or ms/scan"}
    validations: {required: true}
  - type: textarea
    id: hypothesis
    attributes: {label: Hypothesis and mechanism}
    validations: {required: true}
  - type: textarea
    id: prediction
    attributes: {label: Prediction (direction and size) and what would falsify it}
    validations: {required: true}
  - type: input
    id: change
    attributes: {label: The one change (flag / config key)}
    validations: {required: true}
